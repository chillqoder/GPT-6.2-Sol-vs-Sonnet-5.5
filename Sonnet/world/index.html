<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// let the browser paint the "Forging the world…" screen before the (synchronous) world generation starts
await new Promise((resolve) => requestAnimationFrame(() => setTimeout(resolve, 40)));
const T_BUILD0 = performance.now();

/* ======================================================================
   0. UTILITIES, NOISE
   ====================================================================== */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260822);          // world-building random stream
const rr = (a, b) => a + (b - a) * rand();  // random range

const PERM = new Uint8Array(512);
{
  const nr = mulberry32(90210), p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(nr() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
}
const GX = new Float32Array([1, -1, 1, -1, 1, -1, 0, 0]);
const GY = new Float32Array([1, 1, -1, -1, 0, 0, 1, -1]);
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const X = xi & 255, Y = yi & 255;
  const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
  const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  const a = PERM[PERM[X] + Y] & 7, b = PERM[PERM[X + 1] + Y] & 7;
  const c = PERM[PERM[X] + Y + 1] & 7, d = PERM[PERM[X + 1] + Y + 1] & 7;
  const n00 = GX[a] * xf + GY[a] * yf;
  const n10 = GX[b] * (xf - 1) + GY[b] * yf;
  const n01 = GX[c] * xf + GY[c] * (yf - 1);
  const n11 = GX[d] * (xf - 1) + GY[d] * (yf - 1);
  const nx0 = n00 + (n10 - n00) * u, nx1 = n01 + (n11 - n01) * u;
  return nx0 + (nx1 - nx0) * v;
}
function fbm(x, y, oct) {
  let s = 0, a = 1, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * noise2(x * f + i * 31.7, y * f - i * 17.3); n += a; a *= 0.5; f *= 2.02; }
  return s / n;
}
function ridged(x, y, oct) {
  let s = 0, a = 1, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { const r = 1 - Math.abs(noise2(x * f + i * 13.1, y * f + i * 7.7)); s += a * r * r; n += a; a *= 0.5; f *= 2.05; }
  return s / n;
}

/* ======================================================================
   1. WORLD CONSTANTS, RIVERS, HEIGHT FIELD
   ====================================================================== */
const WORLD_HALF = 1500;      // gameplay area  (3000 x 3000)
const TERRAIN_HALF = 1800;    // terrain mesh extends slightly into the sea
const GRID_N = 320;           // terrain segments per side
const RIVER_W = 52;           // river half-width scale

// Four race zones (quadrants) -- centres of their "core" areas
const ZONES = {
  elf:   { x: -800, z: -800, name: 'Elven Forest' },
  dwarf: { x:  850, z: -850, name: 'Dwarven Highlands' },
  human: { x: -780, z:  760, name: 'Human City' },
  orc:   { x:  800, z:  800, name: 'Orc Wastes' },
};

// Two rivers cross the world and separate the four zones.
const riverNSx = (z) => 34 * Math.sin(z * 0.0042 + 1.1) + 20 * Math.sin(z * 0.0113 + 2.3);
const riverEWz = (x) => 38 * Math.sin(x * 0.0036 + 0.4) + 18 * Math.sin(x * 0.0107 + 4.2);
const riverNSdx = (z) => 34 * 0.0042 * Math.cos(z * 0.0042 + 1.1) + 20 * 0.0113 * Math.cos(z * 0.0113 + 2.3);
const riverEWdz = (x) => 38 * 0.0036 * Math.cos(x * 0.0036 + 0.4) + 18 * 0.0107 * Math.cos(x * 0.0107 + 4.2);
function riverDist(x, z) {
  const a = Math.abs(x - riverNSx(z)), b = Math.abs(z - riverEWz(x));
  const k = 30, h = Math.max(k - Math.abs(a - b), 0) / k;
  return Math.min(a, b) - h * h * k * 0.25;
}

function baseHills(x, z) {
  const n1 = fbm(x * 0.0021 + 10, z * 0.0021 + 20, 4);
  const n2 = fbm(x * 0.0065 + 50, z * 0.0065 - 30, 3);
  const n3 = fbm(x * 0.0150 - 9, z * 0.0150 + 41, 2);
  const hills = Math.max(0, n1 + 0.25) * 1.25;           // rounded hill masses with flat valleys between
  return 22 + hills * hills * 95 + n1 * 24 + n2 * 12 + n3 * 3.5;
}

/* Height modifiers added by individual zones (registered below, in stage order). */
const heightMods = [];
/* ---- Human city layout (pure data here; geometry is built later) ---- */
const CITY = (() => {
  const C = ZONES.human, ROT = 0.28, P = 44, BLOCK = 36, R0 = 64;
  const cs = Math.cos(ROT), sn = Math.sin(ROT);
  const toWorld = (u, v) => [C.x + u * cs - v * sn, C.z + u * sn + v * cs];
  const radiusAt = (ang) => 392 + 40 * noise2(Math.cos(ang) * 1.4 + 5, Math.sin(ang) * 1.4 + 9);
  const blocks = [];
  for (let j = -11; j <= 11; j++) for (let i = -11; i <= 11; i++) {
    const u = i * P, v = j * P, r = Math.hypot(u, v);
    if (r < R0 + 8 || r > radiusAt(Math.atan2(v, u)) - 24) continue;
    blocks.push({ i, j, u, v, r });
  }
  return { C, ROT, P, BLOCK, R0, cs, sn, toWorld, blocks, radiusAt };
})();
heightMods.push((h, x, z) => {          // the city sits on a wide flat plateau
  const d = Math.hypot(x - CITY.C.x, z - CITY.C.z);
  const w = 1 - smoothstep(440, 820, d);
  return lerp(h, 18 + noise2(x * 0.008 + 4, z * 0.008) * 1.3, w);
});
/* ---- Dwarven highlands: mountain range, mining terraces, factory plateau, fortress ledge ---- */
const DW = { F: { x: 660, z: -660 }, D0: { x: 700, z: -700 }, HD: 86, GATE: { x: 1010, z: -1010 }, HG: 130 };
function dwarfMountainMask(x, z) {
  const dF = Math.hypot(x - DW.F.x, z - DW.F.z);
  return smoothstep(200, 1000, dF) * smoothstep(40, 700, x) * smoothstep(-40, -700, z) * smoothstep(70, 330, riverDist(x, z));
}
heightMods.push((h, x, z) => {                       // the range itself: ridged noise, highest in the NE corner
  const M = dwarfMountainMask(x, z);
  if (M <= 0.001) return h;
  const ridge = ridged(x * 0.0019 + 40, z * 0.0019 - 12, 5), crest = ridged(x * 0.006 - 7, z * 0.006 + 3, 3);
  return h + Math.pow(M, 1.15) * (170 + ridge * 560 + crest * 100);
});
heightMods.push((h, x, z) => {                       // terraced foothills (mining benches)
  const dF = Math.hypot(x - DW.F.x, z - DW.F.z);
  const tm = smoothstep(230, 420, dF) * (1 - smoothstep(780, 1000, dF)) * (1 - smoothstep(190, 300, h)) * smoothstep(100, 430, x) * smoothstep(-100, -430, z);
  if (tm <= 0) return h;
  const S = 15, t = h / S, f = Math.floor(t), fr = t - f;
  return lerp(h, (f + smoothstep(0.6, 0.95, fr)) * S, tm * 0.8);
});
heightMods.push((h, x, z) => {                       // the flat factory plateau
  const w = 1 - smoothstep(255, 520, Math.hypot(x - DW.D0.x, z - DW.D0.z));
  return w > 0 ? lerp(h, DW.HD + noise2(x * 0.02, z * 0.02) * 0.7, w) : h;
});
heightMods.push((h, x, z) => {                       // ledge in front of the Great Gate (flat on the SW side only)
  const dx = x - DW.GATE.x, dz = z - DW.GATE.z, d = Math.hypot(dx, dz);
  const front = smoothstep(-25, 40, (-dx + dz) * 0.7071);
  const w = (1 - smoothstep(60, 130, d)) * front;
  return w > 0 ? lerp(h, DW.HG, w) : h;
});
/* ---- Elven forest: soft rolling hills with a central hill for the great-tree city ---- */
const EC = { x: ZONES.elf.x, z: ZONES.elf.z };
heightMods.push((h, x, z) => {
  const reg = smoothstep(-40, -420, x) * smoothstep(-40, -420, z);
  if (reg <= 0) return h;
  const d = Math.hypot(x - EC.x, z - EC.z), hill = 1 - smoothstep(60, 430, d);
  return h + reg * (fbm(x * 0.004 + 3, z * 0.004 - 5, 3) * 26 + hill * hill * 52 + 12);
});
/* ---- Orc wastes: terraced mesas and gullies around a flat scrapyard basin ---- */
const OC = { x: ZONES.orc.x, z: ZONES.orc.z, H: 34 };
heightMods.push((h, x, z) => {
  const reg = smoothstep(40, 420, x) * smoothstep(40, 420, z);
  if (reg <= 0) return h;
  const d = Math.hypot(x - OC.x, z - OC.z);
  const rough = ridged(x * 0.0045 + 21, z * 0.0045 - 9, 4);
  const mesaN = (fbm(x * 0.0035 + 2, z * 0.0035 + 8, 3) * 0.5 + 0.5) * 4.2, st = Math.floor(mesaN);
  const mesa = (st + smoothstep(0.72, 0.96, mesaN - st)) / 4.2;
  const hh = h + (rough * 58 + mesa * 74) * smoothstep(250, 480, d) * reg;
  const yard = 1 - smoothstep(235, 340, d);
  return yard > 0 ? lerp(hh, OC.H + noise2(x * 0.02, z * 0.02) * 0.8, yard) : hh;
});
// @@HEIGHT_MODS

function terrainHeight(x, z) {
  let h = baseHills(x, z);
  for (let i = 0; i < heightMods.length; i++) h = heightMods[i](h, x, z);
  // river valley: flood plain + channel
  const d = riverDist(x, z);
  const plain = 1 - smoothstep(RIVER_W * 1.0, RIVER_W * 5.0, d);
  h = lerp(h, 4.0 + noise2(x * 0.012, z * 0.012) * 1.4, plain);
  const chan = 1 - smoothstep(RIVER_W * 0.35, RIVER_W * 1.05, d);
  h = lerp(h, -7, chan);
  // coast: land sinks into the sea outside the world
  const ext = Math.max(Math.abs(x), Math.abs(z)) * 0.72 + Math.hypot(x, z) * 0.28 + fbm(x * 0.0026 + 3, z * 0.0026 - 8, 3) * 150;
  const edge = smoothstep(1330, 1640, ext);
  h = lerp(h, -42, edge);
  return h;
}

/* ======================================================================
   2. RENDERER, SCENE, GLOBAL SHADER STATE
   ====================================================================== */
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); }
catch (err) { document.getElementById('loading').textContent = 'WebGL is not available in this browser.'; throw err; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xa9c4dc, 0.00030);
renderer.setClearColor(0xa9c4dc);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.8, 9000);
camera.rotation.order = 'YXZ';

/* Global uniforms shared by every custom / patched material.
   Colours that feed fog and sky are kept in *display* (sRGB) space. */
const G = {
  uTime:     { value: 0 },
  uNight:    { value: 0 },        // 0 = day, 1 = deep night (smoothed)
  uDayLight: { value: 1 },        // brightness factor for unlit shaders
  uSunDir:   { value: new THREE.Vector3(0.3, 0.8, 0.5).normalize() },
  uMoonDir:  { value: new THREE.Vector3(-0.3, -0.8, -0.5).normalize() },
  uHorizon:  { value: new THREE.Vector3(0.66, 0.77, 0.87) },
  uZenith:   { value: new THREE.Vector3(0.20, 0.42, 0.78) },
  uSunScat:  { value: new THREE.Vector3(0.10, 0.08, 0.04) },
  uSunCol:   { value: new THREE.Vector3(1.0, 0.95, 0.85) },
  uCloudIn:  { value: 0 },        // 0..1: how deep the camera is inside a cloud
  uCloudCol: { value: new THREE.Vector3(0.82, 0.85, 0.9) },
};
G.uFogSunDir  = G.uSunDir;   // aliases consumed by the fog chunk
G.uFogSunScat = G.uSunScat;
function hookGlobals(shader) { for (const k in G) shader.uniforms[k] = G[k]; return shader; }

/* Fog chunk override: exponential fog whose colour is tinted by the sun
   direction (aerial perspective / sunset glow) and that matches the sky dome. */
THREE.ShaderChunk.fog_pars_vertex = `
#ifdef USE_FOG
  varying float vFogDepth;
  varying vec3 vFogDir;
#endif`;
THREE.ShaderChunk.fog_vertex = `
#ifdef USE_FOG
  vFogDepth = - mvPosition.z;
  vFogDir = mvPosition.xyz * mat3( viewMatrix );
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `
#ifdef USE_FOG
  uniform vec3 fogColor;
  varying float vFogDepth;
  varying vec3 vFogDir;
  uniform vec3 uFogSunDir;
  uniform vec3 uFogSunScat;
  #ifdef FOG_EXP2
    uniform float fogDensity;
  #else
    uniform float fogNear;
    uniform float fogFar;
  #endif
#endif`;
THREE.ShaderChunk.fog_fragment = `
#ifdef USE_FOG
  #ifdef FOG_EXP2
    float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
  #else
    float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
  #endif
  vec3 fogD = normalize( vFogDir );
  float fogSd = max( dot( fogD, uFogSunDir ), 0.0 );
  vec3 fogC = fogColor + uFogSunScat * ( pow( fogSd, 5.0 ) * 0.5 + pow( fogSd, 48.0 ) * 1.2 );
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fogC, fogFactor );
#endif`;

const GLSL_NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  float a = hash12(i), b = hash12(i+vec2(1.,0.)), c = hash12(i+vec2(0.,1.)), d = hash12(i+vec2(1.,1.));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }
float fbm2(vec2 p){ float s = 0., a = .5; for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + 17.1; a *= .5; } return s; }
`;
/* Sky colour as seen in direction d (display space). Needs uSunDir/uSunScat declared by the caller. */
const GLSL_SKY = `
uniform vec3 uHorizon; uniform vec3 uZenith; uniform vec3 uMoonDir;
vec3 scatterAt(vec3 d){ float sd = max(dot(d, uFogSunDir), 0.0); return uFogSunScat * (pow(sd,5.0)*0.5 + pow(sd,48.0)*1.2); }
vec3 skyBase(vec3 d){ float h = clamp(d.y, 0.0, 1.0); return mix(uHorizon, uZenith, pow(h, 0.42)) + scatterAt(d); }
`;

/* Per-frame callbacks registered by the world modules. */
const updaters = [];

/* Lights (driven by the day/night module in stage 2) */
const hemi = new THREE.HemisphereLight(0xbcd6ff, 0x6b5a3c, 2.4);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xfff0d8, 3.2);
sunLight.position.set(300, 800, 500);
scene.add(sunLight);
const moonLight = new THREE.DirectionalLight(0x7f96d8, 0.0);
scene.add(moonLight);

/* ======================================================================
   3. TERRAIN
   ====================================================================== */
const SPLAT_SIZE = 2048;
const splat = {
  canvas: document.createElement('canvas'),
  toPx: (v) => (v + TERRAIN_HALF) / (2 * TERRAIN_HALF) * SPLAT_SIZE,
  scale: SPLAT_SIZE / (2 * TERRAIN_HALF),   // pixels per world unit
};
splat.canvas.width = splat.canvas.height = SPLAT_SIZE;
splat.ctx = splat.canvas.getContext('2d');
splat.ctx.clearRect(0, 0, SPLAT_SIZE, SPLAT_SIZE);
// @@SPLAT_PAINT
const splatTex = new THREE.CanvasTexture(splat.canvas);
splatTex.flipY = false;
splatTex.premultiplyAlpha = false;
splatTex.wrapS = splatTex.wrapT = THREE.ClampToEdgeWrapping;
splatTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
splatTex.colorSpace = THREE.SRGBColorSpace;
splatTex.generateMipmaps = true;
splatTex.minFilter = THREE.LinearMipmapLinearFilter;

const COL = {
  grassA: new THREE.Color('#5f8f3d'), grassB: new THREE.Color('#88a244'), grassDark: new THREE.Color('#3f6a2d'),
  dirt: new THREE.Color('#82704d'), rock: new THREE.Color('#77736b'), sand: new THREE.Color('#b9aa7c'),
  mud: new THREE.Color('#4f4a3a'), seabed: new THREE.Color('#3b4f4a'),
};
const groundMods = [];
const _dwA = new THREE.Color(), _dwB = new THREE.Color();
const DWC = { grass: new THREE.Color('#79794f'), rock: new THREE.Color('#706b63'), rockD: new THREE.Color('#524e49'), snow: new THREE.Color('#eceef2'), slag: new THREE.Color('#4a453f') };
groundMods.push((x, z, h, slope, out) => {          // dwarven highlands colouring
  const reg = smoothstep(60, 380, x) * smoothstep(-60, -380, z);
  if (reg <= 0) return;
  const n = noise2(x * 0.012, z * 0.012) * 0.5 + 0.5;
  out.lerp(_dwA.copy(DWC.grass).lerp(DWC.rock, n * 0.5), reg * 0.85);
  const strata = 0.5 + 0.5 * Math.sin(h * 0.3 + noise2(x * 0.01, z * 0.01) * 5);
  const rockW = Math.max(smoothstep(85, 230, h + n * 40), smoothstep(0.15, 0.4, slope)) * reg;
  out.lerp(_dwB.copy(DWC.rock).lerp(DWC.rockD, strata * 0.55), rockW);
  const snowW = smoothstep(320, 410, h + noise2(x * 0.02, z * 0.02) * 50) * (1 - smoothstep(0.34, 0.6, slope)) * reg;
  out.lerp(DWC.snow, snowW);
  out.lerp(DWC.slag, (1 - smoothstep(180, 330, Math.hypot(x - DW.D0.x, z - DW.D0.z) + noise2(x * 0.02, z * 0.02) * 40)) * 0.7);
});
const ELC = { moss: new THREE.Color('#2f6f3e'), lush: new THREE.Color('#4f9a45'), floor: new THREE.Color('#3a5a34'), flower: new THREE.Color('#8fb44a') };
groundMods.push((x, z, h, slope, out) => {          // elven forest floor: deep emerald moss
  const reg = smoothstep(-40, -380, x) * smoothstep(-40, -380, z);
  if (reg <= 0) return;
  const n = noise2(x * 0.015 + 9, z * 0.015) * 0.5 + 0.5, d = Math.hypot(x - EC.x, z - EC.z);
  out.lerp(_dwA.copy(ELC.moss).lerp(ELC.lush, n), reg * 0.9);
  out.lerp(ELC.floor, reg * (1 - smoothstep(120, 620, d)) * 0.35);
  if (noise2(x * 0.03 - 4, z * 0.03 + 2) > 0.45) out.lerp(ELC.flower, reg * 0.35);
});
const ORCC = { dirt: new THREE.Color('#8f5c3a'), dirt2: new THREE.Color('#a56c40'), ash: new THREE.Color('#625850'), oil: new THREE.Color('#2e2723'), rock: new THREE.Color('#7e5c48') };
groundMods.push((x, z, h, slope, out) => {          // orc wastes: rust, ash and oil
  const reg = smoothstep(40, 380, x) * smoothstep(40, 380, z);
  if (reg <= 0) return;
  const n = noise2(x * 0.012 + 3, z * 0.012 - 7) * 0.5 + 0.5, n2 = noise2(x * 0.035, z * 0.035 + 5);
  out.lerp(_dwA.copy(ORCC.dirt).lerp(ORCC.dirt2, n), reg * 0.93);
  if (n2 > 0.25) out.lerp(ORCC.ash, reg * smoothstep(0.25, 0.7, n2) * 0.7);
  out.lerp(ORCC.rock, reg * smoothstep(0.12, 0.35, slope) * 0.6);
  const d = Math.hypot(x - OC.x, z - OC.z);
  out.lerp(ORCC.oil, reg * (1 - smoothstep(60, 280, d)) * 0.28);

// @@GROUND_COLOR_MODS

function groundColor(x, z, h, slope, out) {
  const n = fbm(x * 0.004 + 7, z * 0.004 - 3, 3) * 0.5 + 0.5;
  out.copy(COL.grassA).lerp(COL.grassB, n);
  out.lerp(COL.grassDark, (noise2(x * 0.03, z * 0.03) * 0.5 + 0.5) * 0.28);
  for (let i = 0; i < groundMods.length; i++) groundMods[i](x, z, h, slope, out);
  out.lerp(COL.rock, smoothstep(0.2, 0.46, slope));
  const rd = riverDist(x, z);
  if (h < 5.5 && rd < RIVER_W * 2.2) out.lerp(COL.sand, (1 - smoothstep(RIVER_W * 0.7, RIVER_W * 1.7, rd)) * smoothstep(5.5, 1.0, h));
  out.lerp(COL.seabed, smoothstep(0.4, -3, h));
  return out;
}

const terrain = (() => {
  const N = GRID_N, stride = N + 1, step = (2 * TERRAIN_HALF) / N;
  const pos = new Float32Array(stride * stride * 3);
  const col = new Float32Array(stride * stride * 3);
  const Hs = new Float32Array(stride * stride);
  for (let j = 0; j <= N; j++) {
    for (let i = 0; i <= N; i++) {
      const x = -TERRAIN_HALF + i * step, z = -TERRAIN_HALF + j * step;
      const h = terrainHeight(x, z);
      const k = j * stride + i;
      Hs[k] = h; pos[k * 3] = x; pos[k * 3 + 1] = h; pos[k * 3 + 2] = z;
    }
  }
  const idx = new Uint32Array(N * N * 6);
  let p = 0;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * stride + i, b = a + 1, c = a + stride, d = c + 1;
    idx[p++] = a; idx[p++] = c; idx[p++] = b; idx[p++] = b; idx[p++] = c; idx[p++] = d;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal.array;
  const c = new THREE.Color();
  for (let k = 0; k < stride * stride; k++) {
    groundColor(pos[k * 3], pos[k * 3 + 2], Hs[k], 1 - nrm[k * 3 + 1], c);
    col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeBoundingSphere();

  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  mat.onBeforeCompile = (sh) => {
    hookGlobals(sh);
    sh.uniforms.tSplat = { value: splatTex };
    sh.uniforms.uSplatHalf = { value: TERRAIN_HALF };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;\nuniform sampler2D tSplat; uniform float uSplatHalf;\n' + GLSL_NOISE)
      .replace('#include <color_fragment>', `#include <color_fragment>
        {
          float dist = length(vWP - cameraPosition);
          vec2 q = vWP.xz;
          float d1 = vnoise(q * 0.31), d2 = vnoise(q * 1.7 + 5.0), d3 = vnoise(q * 7.3 + 11.0);
          float f2 = 1.0 - smoothstep(250.0, 900.0, dist);
          float f3 = 1.0 - smoothstep(60.0, 320.0, dist);
          float detail = 0.84 + 0.22 * d1 + 0.14 * f2 * (d2 - 0.5) + 0.10 * f3 * (d3 - 0.5);
          diffuseColor.rgb *= detail;
          vec2 suv = (vWP.xz + uSplatHalf) / (2.0 * uSplatHalf);
          vec4 sp = texture2D(tSplat, suv);
          diffuseColor.rgb = mix(diffuseColor.rgb, sp.rgb * (0.9 + 0.2 * d2), sp.a);
        }`);
  };
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { mesh, Hs, N, stride, step };
})();

/* ======================================================================
   4. WATER  (rivers + sea; same grid as terrain so shorelines match exactly)
   ====================================================================== */
function riverFlow(x, z) {
  const dN = Math.abs(x - riverNSx(z)), dE = Math.abs(z - riverEWz(x));
  const wN = 1 - smoothstep(RIVER_W * 1.2, RIVER_W * 3.2, dN);
  const wE = 1 - smoothstep(RIVER_W * 1.2, RIVER_W * 3.2, dE);
  let fx = 0, fz = 0;
  { const l = Math.hypot(riverNSdx(z), 1); fx += riverNSdx(z) / l * wN; fz += 1 / l * wN; }
  { const l = Math.hypot(1, riverEWdz(x)); fx += 1 / l * wE; fz += riverEWdz(x) / l * wE; }
  return [fx, fz];
}

function makeWaterNormalTexture() {
  const S = 256, data = new Uint8Array(S * S * 4);
  const wr = mulberry32(777), waves = [];
  for (let i = 0; i < 28; i++) {
    const fx = Math.floor(rr2(wr, 1, 14)) * (wr() < 0.5 ? -1 : 1), fy = Math.floor(rr2(wr, 1, 14));
    const f = Math.hypot(fx, fy) || 1;
    waves.push({ fx, fy, ph: wr() * TAU, a: 1 / Math.pow(f, 0.9) });
  }
  function rr2(r, a, b) { return a + (b - a) * r(); }
  let maxS = 0; const sl = new Float32Array(S * S * 2);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S; let gx = 0, gy = 0;
    for (const w of waves) { const c = Math.cos(TAU * (w.fx * u + w.fy * v) + w.ph) * w.a * TAU; gx += c * w.fx; gy += c * w.fy; }
    sl[(y * S + x) * 2] = gx; sl[(y * S + x) * 2 + 1] = gy; maxS = Math.max(maxS, Math.abs(gx), Math.abs(gy));
  }
  for (let i = 0; i < S * S; i++) {
    data[i * 4] = Math.round((sl[i * 2] / maxS * 0.5 + 0.5) * 255);
    data[i * 4 + 1] = Math.round((sl[i * 2 + 1] / maxS * 0.5 + 0.5) * 255);
    data[i * 4 + 2] = 128; data[i * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(data, S, S, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.needsUpdate = true;
  return t;
}

const water = (() => {
  const { Hs, N, stride, step } = terrain;
  const use = new Int32Array(stride * stride).fill(-1);
  const pos = [], dep = [], flw = [], idx = [];
  const addV = (v) => {
    if (use[v] >= 0) return use[v];
    const x = -TERRAIN_HALF + (v % stride) * step, z = -TERRAIN_HALF + Math.floor(v / stride) * step;
    const f = riverFlow(x, z);
    use[v] = pos.length / 3; pos.push(x, 0, z); dep.push(-Hs[v]); flw.push(f[0], f[1]);
    return use[v];
  };
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * stride + i, b = a + 1, c = a + stride, d = c + 1;
    if (Math.min(Hs[a], Hs[b], Hs[c], Hs[d]) > 1.0) continue;
    const ia = addV(a), ib = addV(b), ic = addV(c), id = addV(d);
    idx.push(ia, ic, ib, ib, ic, id);
  }
  // far sea: four rectangles around the terrain square
  const R = 9000, T = TERRAIN_HALF;
  const rects = [[-R, -R, R, -T], [-R, T, R, R], [-R, -T, -T, T], [T, -T, R, T]];
  for (const [x0, z0, x1, z1] of rects) {
    const base = pos.length / 3;
    pos.push(x0, 0, z0, x1, 0, z0, x0, 0, z1, x1, 0, z1);
    for (let k = 0; k < 4; k++) { dep.push(60); flw.push(0, 0); }
    idx.push(base, base + 2, base + 1, base + 1, base + 2, base + 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('aDepth', new THREE.Float32BufferAttribute(dep, 1));
  geo.setAttribute('aFlow', new THREE.Float32BufferAttribute(flw, 2));
  geo.setIndex(idx);
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 20000);

  const uniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { tNormal: { value: makeWaterNormalTexture() } }]);
  for (const k in G) uniforms[k] = G[k];
  const mat = new THREE.ShaderMaterial({
    uniforms, fog: true, transparent: true, depthWrite: false,
    vertexShader: `
      attribute float aDepth; attribute vec2 aFlow;
      varying vec3 vWorld; varying float vDepth; varying vec2 vFlow;
      #include <fog_pars_vertex>
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz; vDepth = aDepth; vFlow = aFlow;
        vec4 mvPosition = viewMatrix * wp;
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      uniform sampler2D tNormal; uniform float uTime; uniform float uDayLight; uniform float uNight; uniform vec3 uSunCol;
      varying vec3 vWorld; varying float vDepth; varying vec2 vFlow;
      #include <fog_pars_fragment>
      ${GLSL_SKY}
      ${GLSL_NOISE}
      void main(){
        vec3 V = normalize(cameraPosition - vWorld);
        float dist = length(cameraPosition - vWorld);
        vec2 uv = vWorld.xz * 0.05;
        float ph0 = fract(uTime * 0.22), ph1 = fract(uTime * 0.22 + 0.5);
        float w0 = 1.0 - abs(1.0 - 2.0 * ph0);
        vec2 fl = vFlow * 0.55;
        vec2 s0 = texture2D(tNormal, uv - fl * ph0 + vec2(uTime * 0.004, uTime * 0.003)).rg;
        vec2 s1 = texture2D(tNormal, uv - fl * ph1 + vec2(0.37, 0.61) + vec2(uTime * 0.004, uTime * 0.003)).rg;
        vec2 s2 = texture2D(tNormal, uv * 2.7 - fl * 1.6 * ph0 - vec2(uTime * 0.006, 0.0)).rg;
        vec2 s3 = texture2D(tNormal, uv * 2.7 - fl * 1.6 * ph1 + vec2(0.5) - vec2(uTime * 0.006, 0.0)).rg;
        vec2 sl = (mix(s1, s0, w0) + 0.6 * mix(s3, s2, w0) - 1.6 * 0.5) * 2.0;
        float strength = 0.55 * exp(-dist * 0.0009);
        vec3 N = normalize(vec3(-sl.x * strength, 1.0, -sl.y * strength));
        vec3 R = reflect(-V, N); R.y = abs(R.y);
        vec3 refl = skyBase(R);
        float fres = 0.03 + 0.97 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
        float depthT = 1.0 - exp(-max(vDepth, 0.0) * 0.30);
        vec3 shallowC = vec3(0.10, 0.34, 0.33), deepC = vec3(0.025, 0.12, 0.19);
        vec3 body = mix(shallowC, deepC, depthT) * (0.25 + 0.75 * uDayLight);
        vec3 col = mix(body, refl, clamp(fres, 0.0, 1.0));
        // sun / moon glints
        float sg = pow(max(dot(R, uFogSunDir), 0.0), 350.0) + 0.25 * pow(max(dot(R, uFogSunDir), 0.0), 40.0);
        col += uSunCol * sg * 2.2 * smoothstep(-0.05, 0.1, uFogSunDir.y);
        float mg = pow(max(dot(R, uMoonDir), 0.0), 500.0);
        col += vec3(0.55, 0.65, 0.9) * mg * 1.4 * uNight * smoothstep(-0.05, 0.1, uMoonDir.y);
        // shore foam
        float edge = 1.0 - smoothstep(0.0, 1.1, vDepth);
        float fn = vnoise(vWorld.xz * 0.35 + fl * uTime * 0.6) * 0.6 + vnoise(vWorld.xz * 1.3 - fl * uTime) * 0.4;
        float foam = clamp(edge * (0.35 + fn * 1.1) - 0.15, 0.0, 1.0) * (1.0 - smoothstep(0.0, 0.05, -vDepth));
        col = mix(col, vec3(0.92, 0.95, 0.96) * (0.25 + 0.75 * uDayLight), foam * 0.75);
        float alpha = smoothstep(0.0, 0.6, vDepth) * mix(0.80 + 0.2 * fres, 1.0, smoothstep(2.0, 9.0, vDepth));
        alpha = max(alpha, foam * 0.8);
        gl_FragColor = vec4(col, alpha);
        #include <fog_fragment>
      }`,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 2;
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { mesh, mat };
})();

const flight = {
  yaw: 0.0, pitch: -0.18, speed: 110, boost: 5,
  vel: new THREE.Vector3(), keys: Object.create(null), locked: false, dragging: false,
};
camera.position.set(-40, 260, 340);
flight.pitch = -0.2;
const canvasEl = renderer.domElement;
canvasEl.tabIndex = 0;

addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  flight.keys[e.code] = true;
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'Space', 'ShiftLeft'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { flight.keys[e.code] = false; });
addEventListener('blur', () => { for (const k in flight.keys) flight.keys[k] = false; });
canvasEl.addEventListener('mousedown', () => {
  flight.dragging = true;
  try { const r = canvasEl.requestPointerLock && canvasEl.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (_) {}
});
addEventListener('mouseup', () => { flight.dragging = false; });
document.addEventListener('pointerlockchange', () => { flight.locked = document.pointerLockElement === canvasEl; });
addEventListener('mousemove', (e) => {
  if (!flight.locked && !flight.dragging) return;
  flight.yaw -= e.movementX * 0.0022;
  flight.pitch = clamp(flight.pitch - e.movementY * 0.0022, -1.55, 1.55);
});
addEventListener('wheel', (e) => {
  if (e.target !== canvasEl) return;
  flight.speed = clamp(flight.speed * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 15, 700);
}, { passive: true });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _tv = new THREE.Vector3();
function updateCamera(dt) {
  const k = flight.keys;
  camera.rotation.set(flight.pitch, flight.yaw, 0);
  camera.getWorldDirection(_fwd);
  _right.crossVectors(_fwd, camera.up).normalize();
  _tv.set(0, 0, 0);
  if (k.KeyW) _tv.add(_fwd);
  if (k.KeyS) _tv.sub(_fwd);
  if (k.KeyD) _tv.add(_right);
  if (k.KeyA) _tv.sub(_right);
  if (k.KeyE || k.Space) _tv.y += 1;
  if (k.KeyQ) _tv.y -= 1;
  if (_tv.lengthSq() > 0) _tv.normalize();
  const sp = flight.speed * ((k.ShiftLeft || k.ShiftRight) ? flight.boost : 1);
  _tv.multiplyScalar(sp);
  flight.vel.lerp(_tv, 1 - Math.exp(-7 * dt));
  camera.position.addScaledVector(flight.vel, dt);
  // keep inside the world and above ground
  camera.position.x = clamp(camera.position.x, -2400, 2400);
  camera.position.z = clamp(camera.position.z, -2400, 2400);
  camera.position.y = clamp(camera.position.y, 3, 2600);
  const gh = Math.max(terrainHeight(camera.position.x, camera.position.z), 0) + 3;
  if (camera.position.y < gh) camera.position.y = gh;
}

/* ======================================================================
   6a. SKY DOME  (gradient, sun, moon with phase, stars, milky way)
   ====================================================================== */
const skyDome = (() => {
  const uniforms = { uStarRot: { value: new THREE.Matrix3() } };
  for (const k in G) uniforms[k] = G[k];
  const mat = new THREE.ShaderMaterial({
    uniforms, side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = position;
        vec4 p = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0);
        gl_Position = p;
      }`,
    fragmentShader: `
      uniform vec3 uFogSunDir; uniform vec3 uFogSunScat; uniform vec3 uSunCol;
      uniform float uNight; uniform float uTime; uniform mat3 uStarRot;
      uniform float uCloudIn; uniform vec3 uCloudCol;
      varying vec3 vDir;
      ${GLSL_SKY}
      ${GLSL_NOISE}
      float h13(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
      vec3 starLayer(vec3 d, float scale, float density, float size){
        vec3 p = d * scale; vec3 ip = floor(p); vec3 fp = p - ip;
        float h = h13(ip);
        if (h > density) return vec3(0.0);
        vec3 sp = 0.2 + 0.6 * vec3(h13(ip + 17.1), h13(ip + 43.7), h13(ip + 91.3));
        float dd = length(fp - sp);
        float b = smoothstep(size, 0.0, dd) * (0.35 + 0.65 * h13(ip + 5.5));
        vec3 tint = mix(vec3(0.70, 0.82, 1.0), vec3(1.0, 0.86, 0.66), h13(ip + 9.9));
        float tw = 0.78 + 0.22 * sin(uTime * (1.5 + h * 20.0) + h * 400.0);
        return tint * b * tw;
      }
      void main(){
        vec3 d = normalize(vDir);
        vec3 col = skyBase(d);
        float horizonFade = smoothstep(-0.02, 0.18, d.y);

        // ---- stars + milky way (night only) ----
        if (uNight > 0.01) {
          vec3 sd = uStarRot * d;
          vec3 st = starLayer(sd, 62.0, 0.050, 0.15) * 2.0 + starLayer(sd, 135.0, 0.07, 0.24) * 1.4 + starLayer(sd, 28.0, 0.014, 0.12) * 2.8;
          vec3 galN = normalize(vec3(0.35, 0.80, 0.50));
          float gl = dot(sd, galN);
          float band = exp(-gl * gl * 16.0);
          float dust = fbm2(sd.xy * 7.0 + sd.z * 5.0) * 0.9 + 0.1;
          float cloudy = smoothstep(0.35, 0.8, fbm2(sd.zx * 12.0 + 3.0));
          vec3 mw = vec3(0.42, 0.46, 0.70) * band * dust * (1.0 - 0.55 * cloudy) * 0.42;
          mw += vec3(0.9, 0.7, 0.55) * pow(band, 6.0) * dust * 0.10;
          col += (st + mw) * uNight * horizonFade;
        }

        // ---- sun ----
        float sdot = dot(d, uFogSunDir);
        float sunVis = smoothstep(-0.02, 0.012, d.y);
        float disc = smoothstep(0.99962, 0.99978, sdot);
        col += uSunCol * (disc * 4.0 + pow(max(sdot, 0.0), 700.0) * 1.1 + pow(max(sdot, 0.0), 90.0) * 0.18) * sunVis;

        // ---- moon (with phase and surface) ----
        float md = dot(d, uMoonDir);
        float moonVis = smoothstep(-0.03, 0.02, d.y);
        col += vec3(0.50, 0.58, 0.85) * (pow(max(md, 0.0), 220.0) * 0.30 + pow(max(md, 0.0), 24.0) * 0.07) * moonVis * (0.35 + 0.65 * uNight);
        if (md > 0.97 && moonVis > 0.0) {
          vec3 mr = normalize(cross(uMoonDir, vec3(0.0, 1.0, 0.0)));
          vec3 mu = cross(mr, uMoonDir);
          vec2 mp = vec2(dot(d, mr), dot(d, mu)) / 0.046;
          float r2 = dot(mp, mp);
          if (r2 < 1.0) {
            vec3 n = vec3(mp, sqrt(1.0 - r2));
            vec3 L = vec3(dot(uFogSunDir, mr), dot(uFogSunDir, mu), dot(uFogSunDir, -uMoonDir));
            float lit = smoothstep(-0.04, 0.12, dot(n, L));
            float maria = smoothstep(0.38, 0.62, fbm2(n.xy * 3.2 + 4.7));
            float crat = vnoise(n.xy * 17.0) * 0.5 + vnoise(n.xy * 41.0) * 0.5;
            float alb = mix(0.55, 0.98, maria) * (0.82 + 0.3 * crat);
            vec3 mc = vec3(0.92, 0.93, 1.0) * alb * (lit * 1.05 + 0.035);
            float edge = smoothstep(1.0, 0.94, sqrt(r2));
            col = mix(col, mc, edge * moonVis * (0.12 + 0.88 * uNight));
          }
        }
        col = mix(col, uCloudCol, uCloudIn);          // inside a cloud the whole sky turns to mist
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(4500, 48, 24), mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = -100;
  scene.add(mesh);
  return { mesh, mat, uniforms };
})();

const TIME = { hours: 9.0, speed: 1, paused: false, rate: 0.05, scrubbing: false };   // rate: game hours per real second at x1
const SPEEDS = [1, 4, 16, 64];

/* ---- billboard smoke (soot / steam): fully animated in the vertex shader ---- */
function makeSmokeSystem(opts = {}) {

    add(x, y, z, size = 3, rise = 80, puffs = 6, speed = 0.06) { src.push([x, y, z, size, rise, puffs, speed]); return src.length - 1; },
    mesh: null, start: [], vel: null,
    /* move a (moving) source: puffs trail behind it along -velocity */
    move(i, x, y, z, vx, vz) {
      const a = this.mesh.geometry.attributes, n = src[i][5], s0 = this.start[i];
      for (let k = 0; k < n; k++) { const o = (s0 + k) * 4; a.aBase.array[o] = x; a.aBase.array[o + 1] = y; a.aBase.array[o + 2] = z; a.aVel.array[(s0 + k) * 2] = vx; a.aVel.array[(s0 + k) * 2 + 1] = vz; }
      a.aBase.needsUpdate = true; a.aVel.needsUpdate = true;

    build() {

      let k = 0;

        for (let i = 0; i < puffs; i++, k++) {
          base.set([x, y, z, rand()], k * 4);

      geo.setAttribute('aVel', new THREE.InstancedBufferAttribute(vel, 2));
      geo.instanceCount = total;
      const uniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uColA: { value: new THREE.Vector3(...colA) }, uColB: { value: new THREE.Vector3(...colB) }, uAlpha: { value: alpha } }]);
      for (const kk in G) uniforms[kk] = G[kk];

        uniforms, fog: true, transparent: true, depthWrite: false,

/* ---- additive glow sprites for lamps, fires, furnaces (mode 0 = night only, 1 = flicker, 2 = steady) ---- */

    add(x, y, z, size, r, g, b, mode = 0) { items.push(x, y, z, size, r, g, b, mode); return items.length / 8 - 1; },

    mesh: null,

        uniforms, fog: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

        fragmentShader: `
          varying vec2 vUv; varying vec3 vCol;
          #include <fog_pars_fragment>

      });
      const mesh = new THREE.Mesh(geo, mat);

      scene.add(mesh); this.mesh = mesh; return mesh;
    },
  };
  finalizers.push(() => sys.build());
  return sys;
}

const _sm = new THREE.Matrix4(), _pm2 = new THREE.Matrix4(), _spos = new THREE.Vector3(), _sq2 = new THREE.Quaternion(), _se = new THREE.Euler(), _one = new THREE.Vector3(1, 1, 1), _tan = new THREE.Vector3(), _lv = new THREE.Vector3(), _ps = new THREE.Vector3(), _pq = new THREE.Quaternion(), _zz = new THREE.Vector3(0, 0, 1);
function updateFleet(dt, t) {
  for (const k in shipMeshes) shipMeshes[k].n = 0;
  let pi = 0;
  for (const s of fleet) {
    let vx = 0, vz = 0, pitch = 0;
    if (s.curve) {
      s.u = (s.u + s.spec.speed * dt / s.len) % 1;
      s.curve.getPointAt(s.u, _spos); s.curve.getTangentAt(s.u, _tan);

updaters.push((dt, t) => { if (shipSmoke.mesh) updateFleet(dt, t); });

// @@WORLD_OBJECTS

/* ======================================================================
   6z. FINALIZE (build all batches / systems registered above)
   ====================================================================== */
// distance LOD for small decorative batches (landmarks such as giant trees, buildings, masts are never culled by distance)
for (const b of [...ELSB, bushB, shroomB]) b.maxDist = 1500;
for (const b of [barrelB, tiresB, wreckB, rockB, hayB, baleB, ...deadB, lampBatch]) b.maxDist = 1400;
for (const b of [...ORJB]) b.maxDist = 1800;
for (const k in treeBatch) treeBatch[k].maxDist = 2000;
for (const f of finalizers) f();

/* ======================================================================
   7. HUD + MAIN LOOP
   ====================================================================== */
const fpsEl = document.getElementById('fps');
const fpsState = { frames: 0, t: performance.now(), fps: 0 };
function updateHud(now) {
  fpsState.frames++;
  if (now - fpsState.t >= 500) {
    fpsState.fps = fpsState.frames * 1000 / (now - fpsState.t);
    fpsState.frames = 0; fpsState.t = now;
    const i = renderer.info.render;
    const zone = (() => { let best = null, bd = 1e9; for (const k in ZONES) { const d = Math.hypot(camera.position.x - ZONES[k].x, camera.position.z - ZONES[k].z); if (d < bd) { bd = d; best = ZONES[k]; } } return bd < 650 ? best.name : 'Borderlands'; })();
    fpsEl.innerHTML = `FPS ${fpsState.fps.toFixed(0)} <small>· ${(1000 / Math.max(fpsState.fps, 1)).toFixed(1)} ms</small><br>` +
      `<small>draws ${i.calls} · tris ${(i.triangles / 1000).toFixed(0)}k · res ×${perf.ratio.toFixed(2)}<br>alt ${camera.position.y.toFixed(0)} m · ${zone}</small>`;
  }
}

/* Adaptive resolution: keeps the frame rate stable on weaker GPUs by trading pixel density for speed. */
const perf = { ratio: renderer.getPixelRatio(), max: renderer.getPixelRatio(), min: 0.55, ceiling: 99, acc: 0, n: 0, calm: 0, cool: 1, age: 0 };

    perf.ceiling = perf.ratio; applyRatio(Math.max(perf.min, perf.ratio * (avg > 0.034 ? 0.78 : 0.9))); perf.calm = 0; perf.cool = 2;

    if (++perf.calm >= 4) { applyRatio(Math.min(perf.max, perf.ratio * 1.07)); perf.calm = 0; perf.cool = 2; }

const clock = new THREE.Clock();
function frame() {
  const rawDt = clock.getDelta(); adaptResolution(rawDt);
  const dt = Math.min(rawDt, 0.1);
  G.uTime.value += dt;
  updateCamera(dt);
  for (let i = 0; i < updaters.length; i++) updaters[i](dt, G.uTime.value);
  renderer.render(scene, camera);
  updateHud(performance.now());
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.getElementById('loading').classList.add('done');
const buildMs = Math.round(performance.now() - T_BUILD0);
console.info(`[world] built in ${buildMs} ms · ${scene.children.length} scene objects`);

// debug handle
window.world = { THREE, scene, camera, renderer, flight, G, terrainHeight, ZONES, riverDist, riverNSx, riverEWz, updaters, TIME, setTime, sootSmoke, steamPuffs, glowSys, structMat, fleet, cloudState, cloudClusters, cityInfo, perf, buildMs, adaptResolution };
