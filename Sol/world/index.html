<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172322">
<link rel="icon" href="data:,">
<title>Brassbound · The Four Realms</title>
<style>
:root{color-scheme:dark;--ink:#f1e8d3;--gold:#eaca8b;--line:#e9d29a45;--panel:#142423e8;--dim:#d0c8af;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#192c31;color:var(--ink);font:14px/1.4 system-ui,sans-serif}
canvas.world{display:block;width:100vw;height:100dvh;cursor:grab;touch-action:none}
canvas.world:active{cursor:grabbing}
#hud{position:fixed;inset:0;pointer-events:none;isolation:isolate}
#hud::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#14252691 0%,transparent 22%,transparent 67%,#11211f84 100%);box-shadow:inset 0 0 135px #17252535}
button,input{pointer-events:auto;font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #ffd997;outline-offset:4px}
.mono{font:600 11px/1.3 ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase}
.top{position:absolute;top:25px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:flex-start}
.brand{display:flex;align-items:center;gap:11px;text-shadow:0 2px 14px #122220}
.brand svg{width:39px;height:39px;color:var(--gold);flex:none}
.brand strong{display:block;font:400 27px/1 var(--serif);letter-spacing:.055em}
.brand small{display:block;margin-top:6px;color:var(--gold);font-size:10px;letter-spacing:.23em}
.instrument{display:flex;align-items:center;gap:9px;padding:8px 11px;background:#142423c9;border:1px solid var(--line);border-radius:3px;white-space:nowrap;color:var(--dim)}
.instrument b{color:var(--ink);font:inherit;min-width:20px;text-align:right}
.instrument i{width:6px;height:6px;border-radius:50%;background:#a5ca95;box-shadow:0 0 7px #abd98465}
.compass{position:absolute;left:50%;transform:translateX(-50%);top:25px;width:196px;text-align:center;color:var(--ink);text-shadow:0 1px 5px #132927}
.compass .scale{height:13px;margin:6px auto 3px;border-top:1px solid #f1e8d38c;background:repeating-linear-gradient(90deg,transparent 0 11px,#f1e8d397 11px 12px) center top/100% 5px no-repeat;mask-image:linear-gradient(90deg,transparent,black 24%,black 76%,transparent)}
.compass .needle{position:absolute;top:19px;left:calc(50% - 4px);border:4px solid transparent;border-top-color:var(--gold)}
.compass b{font-weight:600;color:#fff1d4}
.bottom{position:absolute;left:30px;right:30px;bottom:24px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:end}
.flight{justify-self:start;max-width:390px;text-shadow:0 2px 12px #10201b,0 1px 3px #10201b}
.flight .eyebrow{display:flex;align-items:center;gap:8px;color:#f0cf90}
.flight .eyebrow::before{content:"";width:19px;height:1px;background:var(--gold)}
.flight h1{font:400 clamp(33px,4vw,54px)/1.02 var(--serif);letter-spacing:-.035em;margin:7px 0 14px}
#fly{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;min-height:36px;border:1px solid #f7d694;border-radius:3px;color:#30281c;background:#ebc68a;font-weight:700;box-shadow:0 2px 12px #182a2660}
#fly:hover{background:#ffe0a4}
#fly svg{width:15px;height:15px}
.keys{display:flex;align-items:center;flex-wrap:wrap;column-gap:12px;row-gap:6px;margin-top:11px;color:#f1e8d3;font-size:12px}
.keys span{white-space:nowrap}
kbd{display:inline-block;margin-right:4px;border:1px solid #e6dbb45a;background:#172620b3;border-radius:3px;padding:1px 4px;color:#fff3d3;font:600 10px/1.4 ui-monospace,monospace}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 24px #10211a36}
.reticule{position:absolute;top:50%;left:50%;width:13px;height:13px;transform:translate(-50%,-50%);opacity:.8;filter:drop-shadow(0 1px 2px #172423)}
.reticule::before,.reticule::after{content:"";position:absolute;background:#f5e9cb}
.reticule::before{width:1px;height:13px;left:6px}.reticule::after{height:1px;width:13px;top:6px}
body:not(.flying) .reticule{display:none}
#notice{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(88vw,420px);padding:18px;text-align:center}
.time-panel{align-self:end;justify-self:center;width:clamp(245px,29vw,365px);padding:11px 13px 9px}
.time-top,.time-track,.time-ends{display:flex;justify-content:space-between;align-items:center;gap:11px}
.time-top{color:var(--gold);margin-bottom:6px}
.time-top output{margin-left:auto;color:var(--ink);font-size:15px}
.time-track svg{width:14px;height:14px;color:var(--gold);flex:none}
.time-track input{min-width:0;width:100%;margin:0;accent-color:#ecc888;cursor:ew-resize}
.time-ends{margin:3px 0 0 25px;color:#c3bea8;font-size:10px}
#time-speed{display:inline-flex;align-items:center;gap:4px;background:#233632;color:var(--ink);min-width:53px;justify-content:center;border:1px solid var(--line);border-radius:3px;padding:4px 6px}
#time-speed:hover,#time-speed[aria-pressed=true]{background:#5e5137;color:#fff2cc}
#time-speed svg{width:12px;height:12px}
@media(max-width:760px){.time-panel{justify-self:start;width:min(100%,320px)}}
.instruments{display:flex;gap:6px}
.world-label{position:absolute;top:0;left:0;display:flex;align-items:center;gap:8px;padding:5px 10px 6px 5px;color:var(--ink);background:#1a2a27df;border:1px solid #e4d3ab65;border-radius:3px;white-space:nowrap;box-shadow:0 4px 13px #0d1e2045}
.world-label[hidden]{display:none}
.world-label svg{width:24px;height:24px;color:var(--marker);padding:2px;border-right:1px solid #dfc78e50}
.world-label small{display:block;font-size:8px;color:var(--marker);letter-spacing:.16em}
.world-label strong{display:block;margin-top:1px;font:400 19px/.96 var(--serif)}
.chart-panel{justify-self:end;width:min(232px,100%);padding:7px}
.chart-header{display:flex;justify-content:space-between;align-items:center;padding:0 1px 6px 2px;color:var(--gold)}
#overview{background:#263933;color:var(--ink);font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:3px}
#overview:hover{background:#5e5137}
#chart-map{position:relative;width:100%;aspect-ratio:232/154;border:1px solid #dbc49364;border-radius:2px;overflow:hidden}
#chart{position:absolute;inset:0;display:block;width:100%;height:100%}
.chart-pin{position:absolute;display:grid;place-items:center;transform:translate(-50%,-50%);width:24px;height:24px;border:1px solid var(--marker);border-radius:50%;color:var(--marker);background:#1e2d28;box-shadow:0 1px 4px #17221c}
.chart-pin:hover,.chart-pin:focus-visible{background:#475744;z-index:1}
.chart-pin svg{width:16px;height:16px}
@media(max-width:760px){.chart-panel{width:139px}.chart-pin{width:19px;height:19px}.chart-pin svg{width:13px;height:13px}.chart-header>span{font-size:9px}.instruments .instrument:first-child{display:none}.world-label strong{font-size:15px}.world-label{gap:4px;padding-right:6px}}
@media(max-width:445px){.chart-panel{width:112px}.chart-header{flex-wrap:wrap;gap:3px}.bottom{column-gap:5px}.time-panel{width:100%;padding:7px}.time-top{gap:5px;font-size:9px}.time-top output{font-size:13px}.time-track{gap:4px}.time-ends{margin-left:15px}.time-track svg{width:11px}.chart-pin{width:16px;height:16px}}
#weather{position:absolute;top:78px;left:50%;transform:translateX(-50%);color:#f4d89e}
#weather[hidden]{display:none}
@media(max-width:760px){#weather{top:122px}}
#notice[hidden]{display:none}
@media(max-width:760px){.top{top:15px;left:15px;right:15px}.bottom{left:15px;right:15px;bottom:14px;gap:10px;grid-template-columns:1fr auto}.flight{grid-column:1/-1}.compass{top:72px;width:116px}.brand strong{font-size:23px}.flight h1{margin-bottom:9px}}
@media(max-height:490px){.top{top:9px}.bottom{bottom:9px}.flight h1{font-size:28px}.keys{margin-top:6px}}
</style>

<body>
<div id="hud">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 44 44" fill="none" aria-hidden="true"><circle cx="22" cy="22" r="17" stroke="currentColor" stroke-width=".8"/><path d="M22 2v5m0 30v5M2 22h5m30 0h5M22 8l3.5 10.5L36 22l-10.5 3.5L22 36l-3.5-10.5L8 22l10.5-3.5L22 8Z" stroke="currentColor"/><path d="M22 8v14H8l10.5-3.5L22 8Zm0 28V22h14l-10.5 3.5L22 36Z" fill="currentColor"/><circle cx="22" cy="22" r="2" fill="currentColor"/></svg>
      <div><strong>BRASSBOUND</strong><small class="mono">The Four Realms</small></div>
    </div>
    <div class="instruments"><div class="instrument mono"><span>ALT</span><b id="altitude">662 m</b></div><div class="instrument mono"><i aria-hidden="true"></i><b id="fps">–</b> FPS</div></div>
  </header>
  <div class="compass mono" aria-label="Flight bearing"><b id="bearing">N</b><div class="scale"></div><div class="needle"></div><span id="heading">000°</span></div>
  <div id="world-labels" aria-hidden="true"></div>
  <div id="weather" class="instrument mono" hidden>In cloud · Low visibility</div>
  <div class="reticule" aria-hidden="true"></div>
  <div class="bottom">
    <section class="flight" aria-label="Flight controls">
      <div class="eyebrow mono" id="location-type">World overview</div>
      <h1 id="location">The Four Realms</h1>
      <button id="fly" type="button"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m3 15 7-11 7 11-7-3-7 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Take flight</span></button>
      <div class="keys"><span><kbd>W A S D</kbd>Move</span><span><kbd>Q / E</kbd>Down / up</span><span><kbd>Shift</kbd>Boost</span><span>Mouse look</span><span><kbd>Esc</kbd>Release</span></div>
    </section>
    <section class="panel time-panel" aria-label="Time of day">
      <div class="time-top mono"><label for="time">Time of day</label><span id="part-of-day">Daylight</span><output id="clock" for="time">09:21</output></div>
      <div class="time-track">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="4" stroke="currentColor"/><path d="M10 1v3m0 12v3M1 10h3m12 0h3M3.6 3.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1" stroke="currentColor"/></svg>
        <input id="time" type="range" min="0" max="24" step=".01" value="9.35">
        <button id="time-speed" class="mono" type="button" aria-label="Speed up time" aria-pressed="false"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="m1 3 6 5-6 5zm7 0 6 5-6 5z"/></svg><span>1×</span></button>
      </div>
      <div class="time-ends mono" aria-hidden="true"><span>00:00</span><span>12:00</span><span>24:00</span></div>
    </section>
    <section class="panel chart-panel" aria-label="Flight chart">
      <div class="chart-header"><span class="mono">Flight chart</span><button type="button" id="overview">Overview</button></div>
      <div id="chart-map"><canvas id="chart" width="464" height="308" aria-hidden="true"></canvas></div>
    </section>
  </div>
  <div id="notice" class="panel" role="status">Loading the world…</div>
</div>
<script type="module">
import * as THREE from 'three';

const $ = (id) => document.getElementById(id);
const { sin, cos, exp, sqrt, PI, floor, abs, min, max, hypot } = Math;
const TAU = PI * 2;
const clamp = THREE.MathUtils.clamp;
const mix = THREE.MathUtils.lerp;
const smooth = THREE.MathUtils.smoothstep;
const color = (hex) => new THREE.Color(hex);
function random(seed) {
  return () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}
function hash(x, z) {
  let n = Math.imul(x, 374761393) + Math.imul(z, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function noise(x, z) {
  const ix = floor(x), iz = floor(z);
  const fx = x - ix, fz = z - iz;
  const a = fx * fx * (3 - 2 * fx), b = fz * fz * (3 - 2 * fz);
  return mix(mix(hash(ix, iz), hash(ix + 1, iz), a), mix(hash(ix, iz + 1), hash(ix + 1, iz + 1), a), b);
}

const scene = new THREE.Scene();
scene.background = color('#a8cbd5');
scene.fog = new THREE.FogExp2('#adc6c7', 0.00038);
const camera = new THREE.PerspectiveCamera(57, innerWidth / innerHeight, 1.4, 6500);
camera.rotation.order = 'YXZ';
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (error) {
  $('notice').textContent = 'This world needs a browser with WebGL 2 enabled.';
  throw error;
}
const maxPixelRatio=min(devicePixelRatio,1.5);
const minPixelRatio=min(.77,maxPixelRatio);
let pixelRatio=maxPixelRatio;
renderer.setPixelRatio(pixelRatio);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.27;
renderer.domElement.className = 'world';
renderer.domElement.tabIndex = 0;
renderer.domElement.setAttribute('aria-label', '3D world. Drag to look or select Take flight.');
document.body.prepend(renderer.domElement);

const hemi = new THREE.HemisphereLight('#dbedff', '#716048', 1.65);
const sun = new THREE.DirectionalLight('#ffe0a9', 2.25);
sun.position.set(-650, 750, 400);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-1080,right:1080,top:1030,bottom:-1030,near:18,far:3160});
sun.shadow.normalBias=.72;
sun.shadow.bias=-.00019;
sun.shadow.autoUpdate=false;
sun.shadow.needsUpdate=true;
scene.add(hemi,sun,sun.target);

// Sky and the clock share the same solar direction.
const timeSlider = $('time');
const speedButton = $('time-speed');
let hour = 9.35;
let fastTime = false;
let scrubbing=false, holdClockUntil=0;
const skyUniforms = {
  zenith:{value:color('#568cae')}, horizon:{value:color('#e2dcc0')},
  dark:{value:0}, sunDir:{value:new THREE.Vector3()}, moonDir:{value:new THREE.Vector3()}
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(4460,40,24),
  new THREE.ShaderMaterial({
    uniforms:skyUniforms, side:THREE.BackSide, depthWrite:false,
    vertexShader:`
      varying vec3 skyDirection;
      void main(){
        skyDirection = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.);
      }`,
    fragmentShader:`
      uniform vec3 zenith, horizon, sunDir, moonDir;
      uniform float dark;
      varying vec3 skyDirection;
      void main(){
        vec3 ray = normalize(skyDirection);
        float elevation = pow(clamp(ray.y*1.92+.37,0.,1.),.67);
        vec3 base = mix(horizon,zenith,elevation);
        float sunAngle = dot(ray,sunDir);
        float moonAngle = dot(ray,moonDir);
        float warm = 1.-smoothstep(.08,.55,abs(sunDir.y));
        base += vec3(.29,.13,.052)*pow(max(0.,sunAngle),5.)*warm*(1.-dark*.95);
        base += vec3(.64,.39,.14)*pow(max(0.,sunAngle),80.)*(1.-dark*.97);
        base += vec3(3.6,2.35,.93)*smoothstep(.99975,.99985,sunAngle);
        base += vec3(.095,.15,.26)*pow(max(0.,moonAngle),135.)*dark;
        float moonDisk = smoothstep(.99970,.99979,moonAngle);
        float crescent = smoothstep(.99955,.99977,dot(ray,normalize(moonDir+vec3(.014,.01,.004))));
        base += vec3(.73,.88,1.15)*moonDisk*(1.-crescent*.30)*dark;
        gl_FragColor = vec4(base,1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
sky.renderOrder = -10;
sky.frustumCulled = false;
scene.add(sky);

const starRandom = random(4567);
const starGeometry = new THREE.BufferGeometry();
const starPositions = new Float32Array(1550*3);
const starSizes = new Float32Array(1550);
for (let i=0;i<starSizes.length;i++) {
  const theta = starRandom()*TAU;
  const vertical = -.16+starRandom()*1.16;
  const radius = 4080*sqrt(1-vertical*vertical);
  starPositions.set([cos(theta)*radius,vertical*4080,sin(theta)*radius],i*3);
  starSizes[i] = .6 + starRandom()**4*2.1;
}
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions,3));
starGeometry.setAttribute('size',new THREE.BufferAttribute(starSizes,1));
const stars = new THREE.Points(starGeometry,new THREE.ShaderMaterial({
  uniforms:{dark:skyUniforms.dark},
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    attribute float size;
    varying float strength;
    void main(){
      strength = mix(.32,1.,smoothstep(-.16,.28,position.y/4080.))*min(1.,size*.7);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.);
      gl_PointSize = size;
    }`,
  fragmentShader:`
    uniform float dark;
    varying float strength;
    void main(){
      float halo = 1.-smoothstep(.14,.52,length(gl_PointCoord-.5));
      gl_FragColor = vec4(.68,.81,1.,strength*halo*dark);
    }`
}));
stars.frustumCulled = false;
scene.add(stars);
const skyDay = color('#6da9c4'), skyNight = color('#071020');
const horizonDay = color('#e1d3b3'), horizonNight = color('#293b4b');
const dusk = color('#dd9f70'), hazeDay = color('#b5c8bf'), hazeNight = color('#202f3e');
const daylightTint = color('#ffe8c9'), duskTint = color('#ffab64');
const upperDay = color('#d9e7f4'), upperNight = color('#94b5f7');
const groundDay = color('#88745a'), groundNight = color('#3f4862');
const sunDir = skyUniforms.sunDir.value;
let lastMinute = -1;
let daylight = 1;
let night = 0;
timeSlider.addEventListener('pointerdown',()=>{scrubbing=true;});
const finishScrub=()=>{scrubbing=false;};
window.addEventListener('pointerup',finishScrub);
window.addEventListener('pointercancel',finishScrub);
window.addEventListener('blur',finishScrub);
timeSlider.addEventListener('input', () => {
  hour=Number(timeSlider.value)%24;
  holdClockUntil=performance.now()+850;
});
speedButton.addEventListener('click', () => {
  fastTime = !fastTime;
  holdClockUntil=0;
  speedButton.setAttribute('aria-pressed',String(fastTime));
  speedButton.querySelector('span').textContent = fastTime ? '60×' : '1×';
});
function updateSky(dt) {
  if (!scrubbing && performance.now()>holdClockUntil) hour = (hour + dt*(fastTime ? .60 : .010)) % 24;
  const angle = TAU * (hour-6)/24;
  sunDir.set(-cos(angle)*.92,sin(angle),.58*cos(angle)).normalize();
  skyUniforms.moonDir.value.set(-sunDir.x*.95,-sunDir.y, .34+.35*sunDir.z).normalize();
  daylight = smooth(sunDir.y,-.18,.19);
  night = 1-smooth(sunDir.y,-.29,.015);
  const twilight = (1-smooth(abs(sunDir.y-.04),0,.35))*(.35+.65*daylight);
  skyUniforms.dark.value = night;
  skyUniforms.zenith.value.copy(skyNight).lerp(skyDay,daylight);
  skyUniforms.horizon.value.copy(horizonNight).lerp(horizonDay,daylight).lerp(dusk,twilight*.65);
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  stars.visible = night>.015;
  stars.rotation.y = angle*.3;
  scene.fog.color.copy(hazeNight).lerp(hazeDay,daylight).lerp(dusk,twilight*.30);
  hemi.color.copy(upperNight).lerp(upperDay,daylight);
  hemi.groundColor.copy(groundNight).lerp(groundDay,daylight);
  hemi.intensity = mix(.65,1.22,daylight);
  sun.position.copy(sunDir).multiplyScalar(1660);
  if (sunDir.y<0) sun.position.copy(skyUniforms.moonDir.value).multiplyScalar(1660);
  sun.color.copy(duskTint).lerp(daylightTint,smooth(sunDir.y,.02,.55));
  if (sunDir.y<0) sun.color.copy(upperNight);
  sun.intensity = 2.55*smooth(sunDir.y,-.035,.35) + .24*night;
  const minute = floor(hour*60);
  if (minute !== lastMinute) {
    const hours = floor(minute/60)%24;
    $('clock').textContent = String(hours).padStart(2,'0')+':'+String(minute%60).padStart(2,'0');
    $('part-of-day').textContent = hours<5 || hours>=20 ? 'Night' : hours<8 ? 'Dawn' : hours<17 ? 'Daylight' : 'Dusk';
    if (!scrubbing) timeSlider.value = String(hour);
    lastMinute = minute;
  }
}

const MAP_EDGE = 1920;
const riverX = (z) => 102 * sin(z * .0035 + .55) + 55 * sin(z * .0076 - .75);
const riverWidth = (z) => 70 + 14 * sin(z * .005 + 1) + 8 * sin(z * .011);
const channelDistance = (x,z) => abs(x - riverX(z)) - riverWidth(z) / 2;
function mound(x,z,cx,cz,rx,rz) {
  return exp(-2.05 * (((x - cx) / rx) ** 2 + ((z - cz) / rz) ** 2));
}
const factoryTerraces = [[-525,-411,135],[-363,-331,75],[-653,-286,74],[-277,-470,92]];
const peaks = [
  [-630,-650,285,269,285],[-453,-710,217,226,226],[-772,-540,214,275,196],
  [-493,-492,204,191,92],[-805,-880,350,320,197],[-352,-865,220,261,147],
  [-1080,-932,320,290,214],[-989,-540,310,275,112],[-924,-811,162,186,121],[-330,-755,104,154,128]
];
function height(x,z) {
  const broad = noise(x * .003 + 50, z * .003 - 50);
  const detail = noise(x * .017, z * .017);
  let land = 24 + broad * 42 + detail * 9;
  land += 31 * mound(x,z,675,-595,690,510) + 22 * mound(x,z,-730,340,470,520);

function makeSoftTexture() {
  const size=64;
  const data=new Uint8Array(size*size*4);
  for (let row=0;row<size;row++) for (let col=0;col<size;col++) {
    const x=(col/(size-1)-.5)*2, y=(row/(size-1)-.5)*2;
    const radius=hypot(x,y);

    const alpha=(1-smooth(radius+grain*.20,.24,.96))*(.61+grain*.39);
    data.set([255,255,255,Math.round(alpha*255)],(row*size+col)*4);
  }
  const texture=new THREE.DataTexture(data,size,size);
  texture.magFilter=texture.minFilter=THREE.LinearFilter;
  texture.needsUpdate=true;
  return texture;
}

const emberCount=bonfires.length*13;
const emberPositions=new Float32Array(emberCount*3);
const emberSizes=new Float32Array(emberCount);
const emberOpacity=new Float32Array(emberCount);
const emberGeo=new THREE.BufferGeometry();
emberGeo.setAttribute('position',particleAttribute(emberPositions,3));
emberGeo.setAttribute('puffSize',particleAttribute(emberSizes,1));
emberGeo.setAttribute('puffOpacity',particleAttribute(emberOpacity,1));
const emberMat=new THREE.PointsMaterial({
  color:'#ffab48',size:1,map:softTexture,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending
});
emberMat.onBeforeCompile=smokeMaterial.onBeforeCompile;
const sparks=new THREE.Points(emberGeo,emberMat);
sparks.name='Bonfire sparks';
sparks.frustumCulled=false;
scene.add(sparks);
function updateNightLights(t) {
  const flicker=.91+.065*sin(t*8.8)+.04*sin(t*14.02+.7);
  lanternMaterial.emissiveIntensity=night*2.6;
  windowMaterial.emissiveIntensity=night*1.15;
  fireMaterial.emissiveIntensity=mix(.63,1.63,night)*flicker;
  glowMat.opacity=.17+.72*night;
  pools.visible=night>.04;
  poolMaterial.uniforms.brightness.value=night*flicker;
  let index=0;
  for (const [x,y,z,r] of bonfires) for (let i=0;i<13;i++,index++) {
    const phase=(t*.70+hash(index,11))%1;
    const angle=hash(index,7)*TAU;
    const scatter=r*(.08+phase*.5)*hash(index,4);
    emberPositions.set([x+cos(angle)*scatter+phase*4.5,y+phase*r*1.82,z+sin(angle)*scatter],index*3);
    emberSizes[index]=(1.2+hash(index,3)*2.25)*(1-.45*phase);
    emberOpacity[index]=(1-phase)**.55*(.35+.6*night);
  }
  for (const attr of Object.values(emberGeo.attributes)) attr.needsUpdate=true;
}
const shadowDirection=new THREE.Vector3(0,0,0);
let lastShadow=-Infinity;
function updateShadow(t) {
  if (t-lastShadow>.24 && shadowDirection.distanceToSquared(sunDir)>.00009) {
    sun.shadow.needsUpdate=true;
    shadowDirection.copy(sunDir);
    lastShadow=t;
  }
}

function viewHome() {
  if (camera.aspect<.85) {
    camera.position.set(180,835,1470);
    camera.lookAt(0,75,-65);
    return;
  }
  camera.position.set(200,662,1095);
  camera.lookAt(0,62,-55);
}
function setFieldOfView() {
  camera.fov=mix(78,57,smooth(camera.aspect,.53,1.25));
  camera.updateProjectionMatrix();
}
setFieldOfView();
viewHome();
const keys = new Set();
const speed = new THREE.Vector3();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const command = new THREE.Vector3();
const controlled = new Set(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','ShiftLeft','ShiftRight','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
let locked = false;
let drag = null;
function rotateView(dx,dy) {
  camera.rotation.y -= dx * .00235;
  camera.rotation.x = clamp(camera.rotation.x - dy * .00235,-1.49,1.49);
}
function flightState() {
  locked = document.pointerLockElement === renderer.domElement;
  document.body.classList.toggle('flying',locked);
  $('fly').querySelector('span').textContent = locked ? 'In flight' : 'Take flight';
  keys.clear();
}
function showDragHint() {
  if (!locked) $('fly').querySelector('span').textContent='Drag to look';
}
function requestFlight() {
  const canvas=renderer.domElement;
  canvas.focus({preventScroll:true});
  if (!canvas.requestPointerLock) {
    showDragHint();
    return;
  }
  try {
    canvas.requestPointerLock()?.catch(showDragHint);
  } catch {
    showDragHint();
  }
}
$('fly').addEventListener('click',requestFlight);
document.addEventListener('pointerlockchange',flightState);
document.addEventListener('pointerlockerror',showDragHint);
document.addEventListener('mousemove', (event) => {
  if (locked) rotateView(event.movementX,event.movementY);
});
renderer.domElement.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || locked) return;
  drag = {x:event.clientX,y:event.clientY,id:event.pointerId};
  renderer.domElement.setPointerCapture(event.pointerId);
});
renderer.domElement.addEventListener('pointermove', (event) => {
  if (!drag || locked || event.pointerId !== drag.id) return;
  rotateView(event.clientX-drag.x,event.clientY-drag.y);
  drag.x = event.clientX;
  drag.y = event.clientY;
});
renderer.domElement.addEventListener('lostpointercapture', () => { drag = null; });
window.addEventListener('keydown', (event) => {
  if (event.code==='Escape' && locked) document.exitPointerLock();
  if (!controlled.has(event.code) || event.metaKey || event.ctrlKey || event.altKey) return;
  if (!locked && ['INPUT','BUTTON'].includes(document.activeElement?.tagName)) return;
  event.preventDefault();
  keys.add(event.code);
});
window.addEventListener('keyup', (event) => { keys.delete(event.code); });
window.addEventListener('blur', () => keys.clear());
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  setFieldOfView();
  renderer.setSize(innerWidth,innerHeight);
});
function updateFlight(dt) {
  if (keys.has('ArrowLeft')) rotateView(-dt*330,0);
  if (keys.has('ArrowRight')) rotateView(dt*330,0);
  if (keys.has('ArrowUp')) rotateView(0,-dt*330);
  if (keys.has('ArrowDown')) rotateView(0,dt*330);
  camera.getWorldDirection(forward);
  right.set(cos(camera.rotation.y),0,-sin(camera.rotation.y));
  command.set(0,0,0);
  command.addScaledVector(forward,Number(keys.has('KeyW'))-Number(keys.has('KeyS')));
  command.addScaledVector(right,Number(keys.has('KeyD'))-Number(keys.has('KeyA')));
  command.y += Number(keys.has('KeyE'))-Number(keys.has('KeyQ'));
  command.normalize().multiplyScalar(keys.has('ShiftLeft') || keys.has('ShiftRight') ? 330 : 108);
  speed.lerp(command,1-exp(-dt*8));
  camera.position.addScaledVector(speed,dt);
  camera.position.x = clamp(camera.position.x,-MAP_EDGE+80,MAP_EDGE-80);
  camera.position.z = clamp(camera.position.z,-MAP_EDGE+80,MAP_EDGE-80);
  camera.position.y = clamp(camera.position.y,max(WATER_Y,height(camera.position.x,camera.position.z))+5,1400);
}
// The chart and labels use the same district coordinates as the world.
const chartWidth = 232;
const chartHeight = 154;
const chartExtent = {left:-1030,right:1060,top:-975,bottom:754};
const chartX = x => (x-chartExtent.left)/(chartExtent.right-chartExtent.left)*chartWidth;
const chartZ = z => (z-chartExtent.top)/(chartExtent.bottom-chartExtent.top)*chartHeight;
const chart = $('chart');
const chartMap = $('chart-map');
const context = chart.getContext('2d');
const chartBase = document.createElement('canvas');
chartBase.width=chartWidth*2;
chartBase.height=chartHeight*2;
const baseContext=chartBase.getContext('2d');
baseContext.scale(2,2);
const chartPoint = new THREE.Vector3();
const labelContainer = $('world-labels');
const districtSymbols = {
  dwarf:'<path d="m2 14 5-9 3 5 3-7 5 11Z"/><path d="m5.4 8 1.6 1.9 1.6-1.9M11.6 6.8l1.3 1.6 1.3-1.6"/>',
  elf:'<path d="M10 3 6 9h2l-4 5h12l-4-5h2l-4-6Zm0 11v3"/>',
  orc:'<path d="m10 2 2.3 4.6 5.1.8-3.7 3.5.9 5.2-4.6-2.4-4.6 2.4.9-5.2-3.7-3.5 5.1-.8Z"/><circle cx="10" cy="10" r="2"/>',
  human:'<path d="M5 17h10M7 17V9l3-6 3 6v8M7 10h6"/><circle cx="10" cy="12.8" r="1.4"/>'
};
function crest(district) {
  return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linejoin="round" aria-hidden="true">'+districtSymbols[district.id]+'</svg>';
}
function drawChartBase() {
  const sample = new THREE.Color();
  for (let y=0;y<chartHeight;y+=2) for (let x=0;x<chartWidth;x+=2) {
    const wx=mix(chartExtent.left,chartExtent.right,x/chartWidth);
    const wz=mix(chartExtent.top,chartExtent.bottom,y/chartHeight);
    const h=height(wx,wz);
    groundColor(wx,wz,h,sample).multiplyScalar(.48+smooth(h,60,350)*.22);
    baseContext.fillStyle='#'+sample.getHexString();
    baseContext.fillRect(x,y,2,2);
  }
  baseContext.lineWidth=.55;
  baseContext.strokeStyle='#dfc89950';
  for (let i=13;i<chartWidth;i+=26) {
    baseContext.beginPath();baseContext.moveTo(i,0);baseContext.lineTo(i,chartHeight);baseContext.stroke();
  }
  for (let i=12;i<chartHeight;i+=26) {
    baseContext.beginPath();baseContext.moveTo(0,i);baseContext.lineTo(chartWidth,i);baseContext.stroke();
  }
  baseContext.beginPath();
  for (let y=0;y<=chartHeight;y++) {
    const z=mix(chartExtent.top,chartExtent.bottom,y/chartHeight);
    const x=chartX(riverX(z));
    if (y===0) baseContext.moveTo(x,y);
    else baseContext.lineTo(x,y);
  }
  baseContext.lineWidth=8;
  baseContext.strokeStyle='#9d9b7a';
  baseContext.stroke();
  baseContext.lineWidth=5;
  baseContext.strokeStyle='#59868c';
  baseContext.stroke();
  for (const {z} of crossings) {
    const y=chartZ(z),x=chartX(riverX(z));
    baseContext.strokeStyle='#f1d9a2';
    baseContext.lineWidth=1.35;
    baseContext.beginPath();baseContext.moveTo(x-7,y);baseContext.lineTo(x+7,y);baseContext.stroke();
  }
  baseContext.fillStyle='#fff0bf';
  baseContext.font='10px Georgia';
  baseContext.textAlign='center';
  baseContext.fillText('N',chartWidth-13,14);
  baseContext.beginPath();baseContext.moveTo(chartWidth-13,18);baseContext.lineTo(chartWidth-16,26);
  baseContext.lineTo(chartWidth-10,26);baseContext.closePath();baseContext.fill();
}
drawChartBase();
for (const d of districts) {
  const marker=document.createElement('div');
  marker.className='world-label';
  marker.style.setProperty('--marker',d.tint);
  marker.innerHTML=crest(d)+'<span><small class="mono">'+d.race+'</small><strong>'+d.name+'</strong></span>';
  labelContainer.append(marker);
  d.label=marker;

  const pin=document.createElement('button');
  pin.type='button';
  pin.className='chart-pin';
  pin.style.cssText='left:'+(100*chartX(d.x)/chartWidth)+'%;top:'+(100*chartZ(d.z)/chartHeight)+'%;--marker:'+d.tint;
  pin.title='Fly to '+d.name;
  pin.setAttribute('aria-label',pin.title);
  pin.innerHTML=crest(d);
  pin.addEventListener('click',()=>{
    speed.setScalar(0);
    const offsets={dwarf:[140,218,252],elf:[-100,270,390],orc:[123,195,315],human:[110,181,307]};
    const [dx,dy,dz]=offsets[d.id];
    camera.position.set(d.x+dx,height(d.x,d.z)+dy,d.z+dz);
    camera.lookAt(d.x,height(d.x,d.z)+(d.id==='elf'?84:44),d.z);
    renderer.domElement.focus({preventScroll:true});
  });
  chartMap.append(pin);
}
$('overview').addEventListener('click',()=>{
  speed.setScalar(0);
  viewHome();
  renderer.domElement.focus({preventScroll:true});
});
function updateChart() {
  if (!context || chart.hidden) return;
  context.clearRect(0,0,chart.width,chart.height);
  context.drawImage(chartBase,0,0,chart.width,chart.height);
  context.save();
  context.scale(chart.width/chartWidth,chart.height/chartHeight);
  const x=clamp(chartX(camera.position.x),6,chartWidth-6);
  const z=clamp(chartZ(camera.position.z),6,chartHeight-6);
  context.translate(x,z);
  context.rotate(-camera.rotation.y);
  context.beginPath();
  context.moveTo(0,-8);
  context.lineTo(4.4,5.6);
  context.lineTo(0,3.3);
  context.lineTo(-4.4,5.6);
  context.closePath();
  context.fillStyle='#fff3cd';
  context.strokeStyle='#172320';
  context.lineWidth=1.3;
  context.stroke();context.fill();
  context.restore();
  let active=null, distance=Infinity;
  for (const d of districts) {
    const delta=hypot(camera.position.x-d.x,camera.position.z-d.z);
    if (delta<d.radius && delta<distance && camera.position.y<520) {
      distance=delta;
      active=d;
    }
  }
  $('location').textContent=active?.name ?? 'The Four Realms';
  $('location-type').textContent=active?.race ?? 'World overview';
  $('altitude').textContent=Math.round(camera.position.y)+' m';
}
function updateLabels() {
  const width=innerWidth,height=innerHeight;
  camera.updateMatrixWorld();
  for (const d of districts) {
    chartPoint.set(d.x,d.y,d.z).project(camera);
    const safe=width<761?.71:.82;
    const visible=chartPoint.z>0 && chartPoint.z<1 && abs(chartPoint.x)<safe && chartPoint.y>-.47 && chartPoint.y<.75 && cloudDensity<.21;
    if (d.label.hidden===visible) d.label.hidden=!visible;
    if (!visible) continue;
    const edge=width<761?82:96;
    const x=Math.round(clamp((chartPoint.x*.5+.5)*width,edge,width-edge));
    const y=Math.round((.5-chartPoint.y*.5)*height);
    if (x===d.screenX && y===d.screenY) continue;
    d.label.style.transform='translate3d('+x+'px,'+y+'px,0) translate(-50%,-50%)';
    d.screenX=x;
    d.screenY=y;
  }
}

const directions = ['N','NE','E','SE','S','SW','W','NW'];
function updateInstruments() {
  const degrees = ((-camera.rotation.y * 180 / PI) % 360 + 360) % 360;
  $('bearing').textContent = directions[Math.round(degrees/45)%8];
  $('heading').textContent = String(Math.round(degrees)%360).padStart(3,'0')+'°';
}

let previous = performance.now(), fpsStart = previous, frames = 0, elapsed = 0;
let slowSamples=0, fastSamples=0, lastInstruments=0;
const fpsDisplay=$('fps');
function trackPerformance(now) {
  const fps=Math.round(frames*1000/(now-fpsStart));
  fpsDisplay.textContent=String(fps);
  fpsDisplay.parentElement.title=renderer.info.render.calls+' draw calls';
  fpsStart=now;
  frames=0;
  slowSamples=fps<46?slowSamples+1:0;
  fastSamples=fps>=58?fastSamples+1:0;
  if (slowSamples>=3 && pixelRatio>minPixelRatio) {
    pixelRatio=max(minPixelRatio,pixelRatio-.13);
    renderer.setPixelRatio(pixelRatio);
    slowSamples=0;
  }
  if (fastSamples>=18 && pixelRatio<maxPixelRatio) {
    pixelRatio=min(maxPixelRatio,pixelRatio+.10);
    renderer.setPixelRatio(pixelRatio);
    fastSamples=0;
  }
}
function frame(now) {
  const dt = clamp((now-previous)/1000,0,.05);
  previous = now;
  elapsed += dt;
  frames++;
  if (now-fpsStart>650) trackPerformance(now);
  updateFlight(dt);
  if (now-lastInstruments>110) {
    updateInstruments();
    updateChart();
    lastInstruments=now;
  }
  updateLabels();
  updateSky(dt);
  updateSmoke(elapsed);
  updateAirships(elapsed);
  updateClouds(elapsed,dt);
  updateNightLights(elapsed);
  updateShadow(elapsed);
  waterTime.value = elapsed;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
$('notice').hidden = true;
requestAnimationFrame(frame);
</script>
<script>
setTimeout(() => {
  const notice = document.getElementById('notice');
  if (!notice.hidden && notice.textContent === 'Loading the world…') {
    notice.textContent = 'The world is still loading. Check your internet connection for the Three.js download, then reload.';
  }
}, 12000);
</script>
