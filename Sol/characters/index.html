<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#161311">
<title>Aether Armory</title>
<style>
  :root {
    color-scheme: dark;
    --page: #161311;
    --panel: #211b17;
    --line: #45352a;
    --ink: #f1e7d5;
    --muted: #b7a38e;
    --metal: #d99b63;
    --accent: #d99b63;
    --serif: Georgia, 'Times New Roman', serif;
    --mono: ui-monospace, 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-width: 300px; min-height: 100svh; color: var(--ink);
    background: radial-gradient(ellipse at 85% 5%, #2b2018, transparent 58%), var(--page);
    font: 16px/1.5 system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #ffe3aa; outline-offset: 3px; }
  .masthead {
    height: 76px; padding: 0 clamp(18px,3.2vw,52px); display: flex;
    align-items: center; justify-content: space-between; gap: 16px;
    border-bottom: 1px solid var(--line); background: #171310d9;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark { width: 35px; height: 35px; color: var(--metal); flex-shrink: 0; }
  .brand-title { font: normal 27px/1 var(--serif); letter-spacing: .015em; }
  .masthead-note, .eyebrow, .view-hint, .control, .crew-label {
    font: 600 .75rem/1.4 var(--mono); letter-spacing: .13em; text-transform: uppercase;
  }
  .masthead-note { color: var(--muted); text-align: right; }
  .layout {
    display: grid; grid-template-columns: 1fr; gap: 13px;
    max-width: 1690px; padding: 22px clamp(16px,3.2vw,52px) 24px; margin: auto;
  }
  .stage {
    position: relative; isolation: isolate; min-width: 0; min-height: 600px;
    height: calc(100svh - 122px);
    border: 1px solid var(--line); overflow: hidden;
    background: radial-gradient(ellipse at 53% 43%, #4c3527 0%, #261b17 47%, #161210 84%);
  }
  .stage::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 39% 56%,#88563e60,transparent 58%),
      radial-gradient(ellipse at 94% 28%,#65473451,transparent 48%);
  }
  .stage::after {
    content: ''; position: absolute; z-index: 1; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 51% 50%, transparent 58%, #0c090885 100%);
    box-shadow: inset 0 0 0 5px #160f0b33;
  }
  #viewport, #viewport canvas, #crew-labels { position: absolute; inset: 0; width: 100%; height: 100%; }
  #viewport canvas { display: block; outline: none; touch-action: none; cursor: grab; }
  #viewport canvas:active { cursor: grabbing; }
  .view-heading {
    position: absolute; top: clamp(16px,2.1vw,32px); left: clamp(15px,2.3vw,34px);
    z-index: 2; pointer-events: none; text-shadow: 0 2px 12px #120d09;
  }
  .eyebrow { color: var(--metal); }
  .view-heading h2 {
    font: normal clamp(30px,3.5vw,58px)/1.05 var(--serif); margin: 7px 0 0;
    letter-spacing: -.035em; text-wrap: balance;
  }
  .view-footer {
    position: absolute; z-index: 3; bottom: 17px; inset-inline: 17px;
    display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between;
    gap: 10px 16px; pointer-events: none;
  }
  .view-hint { color: #d7c3ae; margin: 0 0 4px; text-shadow: 0 1px 8px #160d08; }
  .control {
    display: inline-flex; align-items: center; gap: 9px; pointer-events: auto;
    border: 1px solid #684c37; background: #201812ed; padding: 10px 12px; color: var(--ink);
    min-height: 39px; letter-spacing: .04em; transition: background .2s, border-color .2s;
  }
  .control:hover, .control[aria-pressed="true"] { border-color: var(--metal); background: #4d3320; }
  .control svg { width: 16px; height: 16px; color: var(--metal); }
  .view-actions { display: flex; gap: 7px; }
  .loading {
    position: absolute; z-index: 4; inset: 0; display: grid; place-items: center;
    padding: 30px; text-align: center; pointer-events: none; margin: 0; color: #e0c5ab;
  }
  .loading[hidden] { display: none; }
  @media (max-width: 650px) {
    .masthead { height: 61px; } .brand-title { font-size: 23px; } .masthead-note { display: none; }
    .layout { padding: 12px 10px; }
    .stage { min-height: 390px; height: min(72svh,600px); }
    .view-footer { bottom: 10px; inset-inline: 10px; }
    .view-hint { display: none; }
    .view-actions { margin-left: auto; }
  }
  .layout { grid-template-columns: clamp(270px,23vw,318px) minmax(0,1fr); gap: 14px; }
  .dossier {
    min-width: 0; background: linear-gradient(153deg,#28201a 0%,#211a16 54%,#1c1714 100%);
    border: 1px solid var(--line); display: flex; flex-direction: column; align-self: stretch;
  }
  .chooser, .brief { padding: 23px clamp(15px,1.7vw,25px); min-width: 0; }
  .chooser { border-bottom: 1px solid var(--line); }
  .roster-title { margin: 0 0 15px; }
  .race-roster { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 7px; }
  .portrait {
    min-width: 0; position: relative; display: flex; flex-direction: column; gap: 0;
    padding: 0; border: 1px solid #594536; background: #191410;
    text-align: center; color: #d5c2ac; transition: border-color .18s, color .18s;
    -webkit-tap-highlight-color: transparent;
  }
  .portrait canvas {
    display: block; width: 100%; aspect-ratio: 1; height: auto;
    background: radial-gradient(ellipse at 50% 67%, var(--portrait-glow), #201914 83%);
    filter: saturate(.75); transition: filter .2s;
  }
  .portrait span {
    display: block; width: 100%; padding: 6px 0 5px;
    font: 600 .68rem/1.3 var(--mono); letter-spacing: .025em; text-transform: uppercase;
  }
  .portrait:hover, .portrait[aria-pressed="true"] { border-color: var(--portrait-accent); color: #fff0d8; }
  .portrait:hover canvas, .portrait[aria-pressed="true"] canvas { filter: saturate(1.1); }
  .portrait[aria-pressed="true"] span { color: #21180e; background: var(--portrait-accent); }
  .brief h1 { font: normal clamp(39px,3.5vw,55px)/1 var(--serif); margin: 0 0 13px; letter-spacing: -.04em; }
  #race-description { color: #d0bda9; margin: 0; line-height: 1.55; }
  .specs { padding-top: 21px; margin-top: 22px; border-top: 1px solid var(--line); }
  .specs h2 { margin: 0 0 15px; }
  .readings { display: grid; gap: 13px; margin: 0; }
  .reading { display: grid; grid-template-columns: 1fr auto; gap: 5px 9px; align-items: center; }
  .reading dt { color: #e9d8c4; font-size: .9rem; }
  .reading dd { margin: 0; }
  .reading .value { color: var(--accent); font: 600 .77rem/1 var(--mono); }
  .reading .track { grid-column: span 2; height: 5px; background: #403127; }
  .track i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .45s ease, background .25s; }
  .mount {
    display: flex; flex-wrap: wrap; column-gap: 12px; row-gap: 4px;
    margin: 25px 0 0; padding-top: 16px; border-top: 1px solid var(--line);
    align-items: center; justify-content: space-between;
  }
  .mount dt { color: var(--muted); font: 600 .70rem/1.35 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
  .mount dd { margin: 0; font-size: .9rem; color: #e1cbb0; }
  #crew-labels { z-index: 2; pointer-events: none; }
  .crew-label {
    position: absolute; padding: 5px 8px; transform: translate(-50%, 0);
    color: #efdbc0; background: #1b1410e8; border: 1px solid #70513a;
    font-size: .69rem; letter-spacing: .07em; white-space: nowrap;
  }
  .crew-label::before { content: ''; position: absolute; left: 50%; bottom: 100%; height: 7px; border-left: 1px solid #a07551; }
  @media (max-width: 950px) {
    .layout { grid-template-columns: 253px minmax(0,1fr); padding-inline: 14px; }
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: minmax(0,1fr); gap: 10px; }
    .dossier { display: contents; }
    .chooser, .brief { border: 1px solid var(--line); background: var(--panel); padding: 15px; }
    .chooser { grid-row: 1; }
    .race-roster { max-width: 416px; }
    .portrait { flex-direction: row; align-items: center; }
    .portrait canvas { width: 52%; flex: none; }
    .portrait span { padding: 4px; font-size: .63rem; }
    .portrait[aria-pressed="true"] { background: var(--portrait-accent); }
    .crew-label { font-size: .60rem; padding: 3px 6px; }
    .stage { grid-row: 2; height: clamp(338px,72vw,535px); min-height: 0; }
    .brief { grid-row: 3; }
    .readings { grid-template-columns: 1fr 1fr; column-gap: 18px; }
    .mount { justify-content: flex-start; }
  }
  @media (max-width: 370px) {
    .portrait { flex-direction: column; }
    .portrait canvas { width: 100%; max-height: 52px; object-fit: contain; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header class="masthead">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true">
      <path d="M18 1.5 34.5 18 18 34.5 1.5 18 18 1.5Z" stroke="currentColor"/>
      <path d="M18 6 30 18 18 30 6 18 18 6Z" stroke="currentColor" opacity=".45"/>
      <path d="m18 10-7 14m7-14 7 14m-11-5h8m-14-2h5m10 0h5" stroke="currentColor" stroke-width="1.4"/>
    </svg>
    <span class="brand-title">Aether Armory</span>
  </div>
  <span class="masthead-note">Aerial combat collection</span>
</header>
<main class="layout">
  <aside class="dossier" aria-label="Flight roster and aircraft specifications">
    <div class="chooser">
      <h2 class="eyebrow roster-title" id="roster-title">Flight roster</h2>
      <div class="race-roster" id="race-roster" role="group" aria-labelledby="roster-title"></div>
    </div>
    <div class="brief">
      <h1 id="race-name" aria-live="polite">Humans</h1>
      <p id="race-description"></p>
      <section class="specs" aria-labelledby="stats-heading">
        <h2 class="eyebrow" id="stats-heading">Aircraft stats</h2>
        <dl class="readings" id="stats"></dl>
      </section>
      <dl class="mount"><dt>Gunner mount</dt><dd id="gunner-mount"></dd></dl>
    </div>
  </aside>
  <section class="stage" aria-label="Interactive aircraft and crew exhibit">
    <div id="viewport"></div>
    <div class="view-heading">
      <div class="eyebrow" id="airframe-class">Exhibition hangar</div>
      <h2 id="airframe-name">The Flight Deck</h2>
    </div>
    <div id="crew-labels">
      <span class="crew-label" hidden>Pilot</span>
      <span class="crew-label" hidden>Gunner</span>
    </div>
    <div class="view-footer">
      <p class="view-hint">Drag to orbit · Scroll to zoom · Right drag to pan</p>
      <div class="view-actions">
        <button type="button" class="control" id="reset" title="Reset camera view" aria-label="Reset camera view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5m0 6v5h-5m-6 0H4v-5"/><circle cx="12" cy="12" r="2.5"/></svg>
        </button>
        <button type="button" class="control" id="rotate" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.5 11a8.5 8.5 0 1 0-1.8 6M20.5 5.5v6h-6"/></svg>
          Auto-rotate
        </button>
      </div>
    </div>
    <p class="loading" id="loading" role="status">Loading the flight deck…</p>
  </section>
</main>
<script type="module">
const loading = document.querySelector('#loading');
const rotationButton = document.querySelector('#rotate');

async function start() {
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const viewport = document.querySelector('#viewport');
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  viewport.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x211713, .032);
  const camera = new THREE.PerspectiveCamera(35, 1, .1, 90);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotateSpeed = .75;
  controls.minDistance = 5;
  controls.maxDistance = 66;
  controls.maxPolarAngle = Math.PI * .475;

  const hemi = new THREE.HemisphereLight(0xffe4cb, 0x8a6959, 1.62);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffdfb0, 3.1);
  key.position.set(-4, 9, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -10, right: 10, top: 9, bottom: -8, near: .5, far: 27 });
  key.shadow.normalBias = .035;
  key.shadow.bias = -.00012;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffad62, 2.2);
  rim.position.set(3, 6, -6);
  scene.add(rim);
  const fill = new THREE.DirectionalLight(0xa6bdcc, 1.0);
  fill.position.set(7, 3, 7);
  scene.add(fill);

  // Shared modeling primitives. Aircraft face -X, wheels and vertical cylinders use Y.
  const P = (x, y, z) => new THREE.Vector3(x, y, z);
  const material = (color, metalness = .15, roughness = .56) =>
    new THREE.MeshStandardMaterial({ color, metalness, roughness });
  const brass = material(0xbb8042, .58, .33);
  const brightBrass = material(0xe2ae5f, .48, .29);
  const copper = material(0xb86636, .55, .43);
  const gunmetal = material(0x34353b, .48, .39);
  const black = material(0x211a19, .16, .68);
  const darkLeather = material(0x462b23, .04, .8);
  const ivory = material(0xddc8a1, .05, .67);
  const enamel = material(0x923c31, .28, .5);
  const lamp = new THREE.MeshStandardMaterial({ color: 0xffb870, emissive: 0xff7426, emissiveIntensity: 2.5 });
  const sphere = new THREE.SphereGeometry(1, 20, 14);
  const cube = new THREE.BoxGeometry(1, 1, 1);
  const cylinders = new Map();

  function group(parent, name, x = 0, y = 0, z = 0) {
    const result = new THREE.Group();
    result.name = name;
    result.position.set(x, y, z);
    parent?.add(result);
    return result;
  }

  function mesh(parent, geometry, surface, x = 0, y = 0, z = 0) {
    const object = new THREE.Mesh(geometry, surface);
    object.position.set(x, y, z);
    object.castShadow = object.receiveShadow = true;
    parent.add(object);
    return object;
  }

  function ellipsoid(parent, surface, x, y, z, rx, ry, rz) {
    const object = mesh(parent, sphere, surface, x, y, z);
    object.scale.set(rx, ry, rz);
    return object;
  }

  function box(parent, surface, x, y, z, w, h, d) {
    const object = mesh(parent, cube, surface, x, y, z);
    object.scale.set(w, h, d);
    return object;
  }

  function cylinder(parent, surface, x, y, z, top, bottom, height, segments = 24) {
    const ratio = bottom / top;
    const key = ratio.toFixed(4) + '/' + segments;
    if (!cylinders.has(key)) cylinders.set(key, new THREE.CylinderGeometry(1, ratio, 1, segments));
    const object = mesh(parent, cylinders.get(key), surface, x, y, z);
    object.scale.set(top, height, top);
    return object;
  }

  function rod(parent, surface, a, b, radius, endRadius = radius, segments = 16) {
    const start = P(...a);
    const end = P(...b);
    const middle = start.clone().lerp(end, .5);
    const object = cylinder(parent, surface, ...middle, endRadius, radius, start.distanceTo(end), segments);
    object.quaternion.setFromUnitVectors(P(0, 1, 0), end.sub(start).normalize());
    return object;
  }

  function tube(parent, surface, points, radius, segments = 24) {
    const curve = new THREE.CatmullRomCurve3(points.map(point => P(...point)));
    return mesh(parent, new THREE.TubeGeometry(curve, segments, radius, 8, false), surface);
  }

  function ring(parent, surface, x, y, z, radius, thickness, axis = 'z') {
    const object = mesh(parent, new THREE.TorusGeometry(radius, thickness, 8, 32), surface, x, y, z);
    if (axis === 'x') object.rotation.y = Math.PI / 2;
    if (axis === 'y') object.rotation.x = Math.PI / 2;
    return object;
  }

  function rivet(parent, surface, x, y, z, r = .035) {
    return ellipsoid(parent, surface, x, y, z, r, r, r);
  }

  // A metal inspection dais, separate crew stations and the hangar floor.
  const podium = group(scene, 'Inspection platforms');
  const base = material(0x312823, .48, .51);
  const deck = material(0x624a36, .36, .64);
  const edge = material(0x936540, .55, .48);
  const floorFinish = material(0x271e19, .14, .91);
  floorFinish.transparent = true;
  floorFinish.depthWrite = false;
  floorFinish.onBeforeCompile = shader => {
    shader.vertexShader = 'varying vec2 vHangar;\n' + shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\nvHangar = (modelMatrix * vec4(transformed, 1.)).xz;'
    );
    shader.fragmentShader = 'varying vec2 vHangar;\n' + shader.fragmentShader.replace(
      '#include <color_fragment>',
      `#include <color_fragment>
      vec2 tiles = vHangar * .5;
      vec2 seam = abs(fract(tiles - .5) - .5) / max(fwidth(tiles), vec2(.0001));
      float grid = 1. - min(min(seam.x, seam.y), 1.);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.13,.077,.050), grid * .42);
      diffuseColor.a *= 1. - smoothstep(6., 24., length(vHangar));`
    );
  };
  const floor = mesh(scene, new THREE.PlaneGeometry(110, 110), floorFinish, 0, -.03, 0);
  floor.rotation.x = -Math.PI / 2;
  floor.castShadow = false;
  floor.renderOrder = -1;

  function makeDais(x, z, radius, main) {
    const plinth = group(podium, main ? 'Aircraft dais' : 'Crew riser', x, 0, z);
    const height = main ? .53 : .32;
    cylinder(plinth, base, 0, height * .45, 0, radius, radius * .98, height * .9, 32);
    cylinder(plinth, edge, 0, .08, 0, radius * 1.017, radius * 1.017, .09, 32);
    cylinder(plinth, deck, 0, height - .06, 0, radius * .965, radius * .99, .12, 32);
    ring(plinth, edge, 0, height + .005, 0, radius * .91, .012, 'y');
    ring(plinth, edge, 0, height + .006, 0, radius * .77, .008, 'y');
    for (let i = 0; i < (main ? 32 : 10); i++) {
      const angle = i * 2 * Math.PI / (main ? 32 : 10);
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const inset = box(plinth, black, x * .994, height * .43, z * .994, .13, height * .39, main ? .36 : .15);
      inset.rotation.y = -angle;
      rivet(plinth, brightBrass, x * .935, height, z * .935, main ? .032 : .021);
      if (main && i % 4 === 1) {
        const indicator = box(plinth, lamp, x * 1.002, .22, z * 1.002, .065, .056, .18);
        indicator.rotation.y = -angle;
      }
    }
    if (main) {
      for (let i = -5; i <= 5; i++) {
        const z = i * .39;
        const extent = Math.sqrt((radius * .74) ** 2 - z * z);
        box(plinth, edge, 0, height + .007, z, extent * 2, .004, .014);
      }
      for (const x of [-.90, .9]) {
        for (const z of [-.37, .37]) {
          rod(plinth, gunmetal, [x * 1.2, .53, z * 1.5], [x * .64, 1.53, z * .8], .095);
          cylinder(plinth, copper, x * 1.2, .59, z * 1.5, .16, .20, .13, 12);
        }
      }
      box(plinth, gunmetal, 0, 1.45, 0, 1.95, .15, .86);
    }
  }

  const stations = {
    aircraft: [-1.38, 2.05, 0],
    pilot: [3.46, .32, .65],
    gunner: [5.34, .32, .99]
  };
  makeDais(stations.aircraft[0], stations.aircraft[2], 3.25, true);
  makeDais(stations.pilot[0], stations.pilot[2], .78, false);
  makeDais(stations.gunner[0], stations.gunner[2], .78, false);

  // Aircraft and crew factories.

  function hull(parent, surface, profile, x = 0, y = 0, z = 0, depth = 1) {
    const points = profile.map(([along, radius]) => new THREE.Vector2(radius, along));
    const object = mesh(parent, new THREE.LatheGeometry(points, 36), surface, x, y, z);
    object.rotation.z = -Math.PI / 2;
    object.scale.x = depth;
    return object;
  }

  function plate(parent, surface, points, depth, bevel = .025) {
    const shape = new THREE.Shape();
    points.forEach(([x, y], i) => i ? shape.lineTo(x, y) : shape.moveTo(x, y));
    shape.closePath();
    const geometry = new THREE.ExtrudeGeometry(shape, {
      depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, steps: 1
    });
    return mesh(parent, geometry, surface);
  }

  function wing(parent, surface, points, y, depth, bevel = .035) {
    const object = plate(parent, surface, points, depth, bevel);
    object.rotation.x = Math.PI / 2;
    object.position.y = y + depth / 2;
    return object;
  }

  function wheelGauge(parent, x, y, z, radius, turn = 0, reading = -.52) {
    const gauge = group(parent, 'Pressure gauge', x, y, z);
    gauge.rotation.y = turn;
    const housing = cylinder(gauge, brass, 0, 0, 0, radius * 1.06, radius * 1.06, .075, 24);
    housing.rotation.x = Math.PI / 2;
    const dial = cylinder(gauge, ivory, 0, 0, .038, radius * .83, radius * .83, .013, 24);

  function createAircraft(race) {

  // Exhaust is drawn as soft procedural particles in each aircraft's local coordinates.
  const exhaustColors = { human: 0xe1c4a9, dwarf: 0xc4c4b9, elf: 0xddd6ba, orc: 0x9a8876 };

  function createExhaustCloud(aircraft, race) {
    const emitters = aircraft.userData.exhausts;
    const puffsPerPipe = race === 'dwarf' ? 7 : 10;
    const count = emitters.length * puffsPerPipe;
    const geometry = new THREE.BufferGeometry();
    for (const [name, size] of [['position',3], ['opacity',1], ['diameter',1], ['variation',1]]) {
      const values = new Float32Array(count * size);
      const attribute = new THREE.BufferAttribute(values, size);
      attribute.setUsage(THREE.DynamicDrawUsage);
      geometry.setAttribute(name, attribute);
    }
    const surface = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        tint: { value: new THREE.Color(exhaustColors[race]) },
        pixelScale: { value: 1 }
      },
      vertexShader: `
        attribute float opacity;
        attribute float diameter;
        attribute float variation;
        uniform float pixelScale;
        varying float vOpacity;
        varying float vVariation;

        void main() {
          vec4 viewPosition = modelViewMatrix * vec4(position, 1.);
          gl_Position = projectionMatrix * viewPosition;
          gl_PointSize = clamp(diameter * pixelScale / max(.01, -viewPosition.z), 1., 120.);
          vOpacity = opacity;
          vVariation = variation;
        }
      `,
      fragmentShader: `
        uniform vec3 tint;
        varying float vOpacity;
        varying float vVariation;

        void main() {
          vec2 p = gl_PointCoord - .5;
          float angle = atan(p.y, p.x);
          float outer = length(p) + .031 * sin(angle * 5. + vVariation);
          float inner = length(p + .08 * vec2(cos(vVariation), sin(vVariation)));
          float density = (1. - smoothstep(.115, .49, outer)) * .70
                        + (1. - smoothstep(0., .28, inner)) * .30;
          gl_FragColor = vec4(tint, density * vOpacity);
          #include <colorspace_fragment>
        }
      `
    });
    const cloud = new THREE.Points(geometry, surface);
    cloud.name = 'Steam and smoke';
    cloud.frustumCulled = false;
    aircraft.add(cloud);
    const particles = emitters.flatMap(({ position, radius }, stack) =>
      Array.from({ length: puffsPerPipe }, (_, i) => ({
        position, radius, phase: i / puffsPerPipe + stack * .37,
        seed: (i * 2.39996 + stack * 1.62), life: (race === 'orc' ? 2.65 : 2.12) + (i % 3) * .13
      })));
    aircraft.userData.cloud = { cloud, particles, dark: race === 'orc' };
  }

  function updateAircraft(aircraft, timeSeconds, deltaSeconds, pixelsPerWorldUnit) {
    const motion = prefersReducedMotion.matches ? .32 : 1;
    for (const { object, speed } of aircraft.userData.rotors) {
      object.rotation.x = (object.rotation.x + speed * deltaSeconds * motion) % (2 * Math.PI);
    }
    const { cloud, particles, dark } = aircraft.userData.cloud;
    cloud.material.uniforms.pixelScale.value = pixelsPerWorldUnit;
    const { position, opacity, diameter, variation } = cloud.geometry.attributes;
    particles.forEach((puff, index) => {
      const age = (timeSeconds * motion / puff.life + puff.phase) % 1;
      const swirl = puff.seed + age * 3.1;
      const spread = .18 * age;
      position.setXYZ(index,
        puff.position.x + age * age * (.38 + (dark ? .17 : 0)) + Math.cos(swirl) * spread,
        puff.position.y + age * (dark ? 1.35 : 1.06),
        puff.position.z + Math.sin(swirl) * spread);
      diameter.setX(index, puff.radius * (2.1 + age * 2.4) + age * .38);
      opacity.setX(index, Math.sin(Math.PI * age) * (dark ? .38 : .31) * (1 - age * .62));
      variation.setX(index, swirl);
    });
    for (const attribute of [position, opacity, diameter, variation]) attribute.needsUpdate = true;
  }

      stats: [94, 32, 98, 54], mount: 'Rear deck', accent: '#aac28b', portrait: '#52674a'
    },
    orc: {
      label: 'Orc', name: 'Orcs', aircraft: 'The Scrapjaw', className: 'Boarding rig',
      description: 'Orc crews weld salvaged armor into asymmetric flying rigs and bolt spikes across the wings. A heavy side turret covers their approach during boarding runs.',
      stats: [62, 83, 49, 91], mount: 'Port side', accent: '#d89771', portrait: '#75523b'
    }
  };
  const prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const exhibits = Object.fromEntries(Object.keys(roster).map(race => [race, createExhibit(race)]));
  const raceRoster = document.querySelector('#race-roster');
  const raceName = document.querySelector('#race-name');
  const description = document.querySelector('#race-description');
  const airframeClass = document.querySelector('#airframe-class');
  const airframeName = document.querySelector('#airframe-name');
  const gunnerMount = document.querySelector('#gunner-mount');
  const stats = document.querySelector('#stats');
  const labels = [...document.querySelectorAll('.crew-label')];
  const stage = document.querySelector('.stage');
  const raceButtons = new Map();

  const readings = ['Speed', 'Armor', 'Maneuverability', 'Firepower'].map(label => {
    const reading = document.createElement('div');
    reading.className = 'reading';
    reading.innerHTML = '<dt></dt><dd class="value"></dd><dd class="track"><i></i></dd>';
    reading.querySelector('dt').textContent = label;
    const value = reading.querySelector('.value');
    const track = reading.querySelector('.track');
    track.setAttribute('aria-hidden', 'true');
    stats.appendChild(reading);
    return { value, bar: track.firstElementChild };
  });

  // The portraits use each pilot's actual head geometry and the main renderer.
  const portraitStage = new THREE.Scene();
  portraitStage.add(new THREE.HemisphereLight(0xffe3c7, 0x998075, 2.0));
  const portraitKey = new THREE.DirectionalLight(0xffe5bf, 3.1);
  portraitKey.position.set(-3, 5, 5);
  portraitStage.add(portraitKey);
  const portraitCamera = new THREE.OrthographicCamera(-.46, .46, .46, -.46, .1, 20);
  portraitCamera.position.set(-.40, .20, 3);
  portraitCamera.lookAt(0, .005, 0);
  renderer.setSize(140, 140, false);
  for (const [race, info] of Object.entries(roster)) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'portrait';
    button.setAttribute('aria-label', info.name);
    button.style.setProperty('--portrait-accent', info.accent);
    button.style.setProperty('--portrait-glow', info.portrait);
    const portrait = document.createElement('canvas');
    portrait.width = portrait.height = 140;
    portrait.setAttribute('aria-hidden', 'true');
    const caption = document.createElement('span');
    caption.textContent = info.label;
    button.append(portrait, caption);
    raceRoster.append(button);
    raceButtons.set(race, button);

    const head = exhibits[race].pilot.userData.head.clone();
    head.position.set(0, race === 'dwarf' ? .055 : 0, 0);
    portraitStage.add(head);
    renderer.render(portraitStage, portraitCamera);
    portrait.getContext('2d').drawImage(renderer.domElement, 0, 0, 140, 140);
    portraitStage.remove(head);
    button.addEventListener('click', () => selectRace(race));
  }
  resize();

  let currentRace = 'human';
  let requestedRace = currentRace;
  let phase = 'idle';
  let elapsed = 0;

  function showDossier(race) {
    const data = roster[race];
    document.documentElement.style.setProperty('--accent', data.accent);
    raceName.textContent = data.name;
    description.textContent = data.description;
    gunnerMount.textContent = data.mount;
    for (const [index, reading] of readings.entries()) {
      const value = data.stats[index];
      reading.value.textContent = String(value);
      reading.value.setAttribute('aria-label', value + ' out of 100');
      reading.bar.style.width = value + '%';
    }
    for (const [key, button] of raceButtons) button.setAttribute('aria-pressed', String(key === race));
  }

  function showAirframe(race) {
    const info = roster[race];
    airframeClass.textContent = info.className;
    airframeName.textContent = info.aircraft;
    viewport.dataset.race = race;
  }

  function replaceExhibit(race) {
    scene.remove(exhibits[currentRace].display);
    currentRace = race;
    scene.add(exhibits[currentRace].display);
    showAirframe(currentRace);
  }

  function poseExhibit(exhibit, progress) {
    exhibit.display.position.y = -.58 * progress;
    exhibit.display.rotation.y = -.08 * progress;
    exhibit.display.scale.setScalar(1 - .09 * progress);
  }

  function selectRace(race) {
    if (race === requestedRace) return;
    requestedRace = race;
    showDossier(race);
    if (prefersReducedMotion.matches) {
      replaceExhibit(race);
      poseExhibit(exhibits[race], 0);
      phase = 'idle';
      stage.classList.remove('is-switching');
    }
  }

  const projected = P(0,0,0);
  const towardsCamera = P(0,0,0);
  function placeCrewLabels() {
    const width = viewport.clientWidth;
    const height = viewport.clientHeight;
    const coordinates = [];
    const compact = width < 480;
    for (const [index, station] of ['pilot','gunner'].entries()) {
      projected.set(...stations[station]);
      towardsCamera.copy(camera.position).sub(projected);
      towardsCamera.y = 0;
      projected.add(towardsCamera.normalize().multiplyScalar(.77));
      projected.y = .065;
      projected.project(camera);
      const x = (projected.x * .5 + .5) * width + (compact ? (index === 0 ? -4 : 4) : 0);
      const y = (-projected.y * .5 + .5) * height + 9;
      const label = labels[index];
      coordinates.push([x,y]);
      const overlap = index > 0 && Math.abs(coordinates[0][0] - x) < (compact ? 46 : 64) && Math.abs(coordinates[0][1] - y) < 31;
      label.hidden = phase !== 'idle' || overlap || projected.z > 1 || x < (compact ? 24 : 35) || x > width - (compact ? 24 : 35) || y < 83 || y > height - 66;
      if (!label.hidden) label.style.transform = 'translate(' + x + 'px,' + y + 'px) translateX(-50%)';
    }
  }

  function updateExhibit(time, delta) {
    if (phase === 'idle' && currentRace !== requestedRace) {
      phase = 'leaving';
      elapsed = 0;
      stage.classList.add('is-switching');
    }
    if (phase !== 'idle') {
      const duration = phase === 'leaving' ? .22 : .42;
      elapsed += delta;
      const progress = Math.min(elapsed / duration, 1);
      const smooth = progress * progress * (3 - 2 * progress);
      poseExhibit(exhibits[currentRace], phase === 'leaving' ? smooth : 1 - smooth);
      if (progress === 1) {
        if (phase === 'leaving') {
          replaceExhibit(requestedRace);
          poseExhibit(exhibits[currentRace], 1);
          phase = 'arriving';
          elapsed = 0;
        } else {
          phase = 'idle';
          stage.classList.remove('is-switching');
        }
      }
    }
    const pixelScale = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
    updateAircraft(exhibits[currentRace].aircraft, time / 1000, delta, pixelScale);
    placeCrewLabels();
  }

  scene.add(exhibits[currentRace].display);
  showDossier(currentRace);
  showAirframe(currentRace);

  let lastTime = performance.now();
  renderer.setAnimationLoop(time => {
    const delta = Math.min(Math.max((time - lastTime) / 1000, 0), .05);
    lastTime = time;
    controls.update(delta);
    camera.updateMatrixWorld();
    updateExhibit(time, delta);
    renderer.render(scene, camera);
  });
  // Standalone builders return new Three.js groups in model coordinates.
  window.aetherArmory = Object.freeze({ createAircraft, createPilot, createGunner });
  loading.hidden = true;
  viewport.dataset.ready = 'true';
}

start().catch(error => {
  console.error(error);
  loading.textContent = 'The flight deck could not start. Check your connection and try a browser with WebGL 2.';
});
</script>
</body>
</html>
